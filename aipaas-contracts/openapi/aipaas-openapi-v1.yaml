  # =========================================================================
  /chat:
    post:
      tags: [生成与推理]
      operationId: chat
      summary: 金融标准问答（非流式，P0 #407）
      description: |
        标准编号直达、条款编号定位、按标准域/发布机构筛选；回答引用条款编号与原文；
        无依据时拒答或兜底，不编造。Java 统一入口先执行输入违规检查，再执行 Prompt 注入/越狱检测，
        通过后才构造并转发内部 Python 问答请求；检出即阻断或净化并告警。
        `sessionId`、`conversationMode` 为 P1 多轮预留，P0 传入也不保持上下文。
      x-owner: java
      x-p0-feature: ['#98', '#103', '#106', '#108', '#110', '#114', '#407']
      x-permission: chat:use
      x-audit: {required: true, actions: [chat.query, security.input.blocked, security.prompt_injection.blocked]}
      x-idempotency: required
