[project]
name = "aipaas-llm"
version = "0.1.0"
description = "AIPaaS LLM 接入层（LLM 客户端、嵌入、重排、MCP）"
requires-python = ">=3.12"
dependencies = [
    "aipaas-common",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-huggingface",
    # 模型服务 HTTP 客户端
    "httpx>=0.27.0",
]

[tool.uv.sources]
aipaas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_llm"]
