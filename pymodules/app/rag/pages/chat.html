<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover" />
  <title>金融标准化知识库</title>
  <style>
    :root{
      --bg:#f4f6fb;
      --panel:#ffffff;
      --text:#1a2233;
      --muted:#8a94a8;
      --brand:#3d7bff;
      --brand2:#7a5cff;
      --bubble-user:linear-gradient(135deg,#3d7bff,#7a5cff);
      --border:#e7eaf2;
      --ring:rgba(61,123,255,.14);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,Arial,sans-serif;
      background:
        radial-gradient(1100px 500px at 12% -10%, rgba(61,123,255,.10), transparent 60%),
        radial-gradient(900px 460px at 92% -6%, rgba(122,92,255,.10), transparent 55%),
        var(--bg);
      color:var(--text);
      height:100vh;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* ===== 顶栏 ===== */
    .topbar{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px clamp(14px,3vw,28px);
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      z-index:10;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .logo{
      width:38px;height:38px;border-radius:12px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;
      display:flex;align-items:center;justify-content:center;
      font-size:17px;font-weight:700;
      box-shadow:0 8px 20px rgba(61,123,255,.32);
      flex:0 0 auto;
    }
    .title{display:flex;flex-direction:column;line-height:1.15;min-width:0}
    .title strong{font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .title span{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
    .top-actions{
      margin-left:auto;
      display:flex;gap:12px;align-items:center;flex:0 0 auto;
    }
    .pill{
      font-size:12px;color:var(--muted);
      border:1px solid var(--border);
      padding:6px 12px;
      border-radius:999px;
      background:#fff;
      display:inline-flex;align-items:center;gap:7px;
      white-space:nowrap;
    }
    .pill::before{
      content:'';width:7px;height:7px;border-radius:50%;
      background:#f59e0b;
      box-shadow:0 0 0 0 rgba(245,158,11,.5);
      animation:pulse 2s infinite;
    }
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(245,158,11,.45)}
      70%{box-shadow:0 0 0 7px rgba(245,158,10,0)}
      100%{box-shadow:0 0 0 0 rgba(245,158,10,0)}
    }
    .btn{
      border:none;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;
      padding:8px 16px;
      border-radius:10px;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(61,123,255,.28);
      transition:transform .15s ease, box-shadow .15s ease, opacity .15s;
      white-space:nowrap;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(61,123,255,.34)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

    /* 流式开关 */
    .stream-switch{
      display:inline-flex;align-items:center;gap:8px;
      font-size:12px;color:var(--muted);
      cursor:pointer;user-select:none;white-space:nowrap;
    }
    .stream-switch input{display:none}
    .track{
      width:38px;height:22px;border-radius:999px;
      background:#d8deeb;
      position:relative;transition:background .2s ease;
      flex:0 0 auto;
    }
    .thumb{
      position:absolute;top:3px;left:3px;
      width:16px;height:16px;border-radius:50%;
      background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,.22);
      transition:transform .2s ease;
    }
    .stream-switch input:checked + .track{background:linear-gradient(135deg,var(--brand),var(--brand2))}
    .stream-switch input:checked + .track .thumb{transform:translateX(16px)}

    /* ===== 消息区 ===== */
    .chat{
      flex:1;
      overflow-y:auto;
      overscroll-behavior:contain;
      padding:22px 0 14px;
      scroll-behavior:auto;
    }
    .chat::-webkit-scrollbar{width:8px}
    .chat::-webkit-scrollbar-thumb{background:rgba(120,132,158,.28);border-radius:8px}
    .chat::-webkit-scrollbar-thumb:hover{background:rgba(120,132,158,.45)}
    .chat::-webkit-scrollbar-track{background:transparent}

    .dayline{
      width:max-content;
      margin:4px auto 18px;
      padding:4px 14px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
      background:rgba(255,255,255,.85);
      border:1px solid var(--border);
      border-radius:999px;
    }
    .msg{
      display:flex;
      gap:12px;
      margin:0 auto;
      padding:0 clamp(14px,4vw,28px);
      width:100%;
      max-width:900px;
      align-items:flex-start;
      animation:msgIn .28s ease both;
    }
    @keyframes msgIn{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
    .msg.user{justify-content:flex-end}
    /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */
    .msg > div:not(.avatar){
      flex:1;
      min-width:0;
    }
    .msg.user > div:not(.avatar){
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .avatar{
      width:38px;height:38px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      font-size:10px;line-height:1.15;
      word-break:break-all;text-align:center;
      overflow:hidden;
      color:#52607a;
      background:#e9eef7;
      border:1px solid #dfe5f0;
      flex:0 0 auto;
      font-weight:600;
    }
    .avatar.bot{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      border-color:transparent;
      color:#fff;
      box-shadow:0 6px 16px rgba(61,123,255,.26);
    }
    .bubble{
      max-width:min(720px, 76%);
      display:inline-block;
      border-radius:18px 18px 18px 6px;
      padding:12px 15px;
      line-height:1.7;
      font-size:15px;
      white-space:pre-wrap;
      overflow-wrap:break-word;
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border-top-right-radius:6px;
      border-top-left-radius:18px;
      border-bottom-right-radius:18px;
      border-bottom-left-radius:18px;
      box-shadow:0 8px 22px rgba(61,123,255,.26);
    }
    .msg.bot .bubble{
      background:transparent;
      padding:2px 0;
      border-radius:0;
      max-width:100%;
    }
    .meta{
      font-size:11px;
      color:var(--muted);
      margin-top:6px;
    }
    .msg.user .meta{color:rgba(255,255,255,.85)}

    details.progress{
      margin-top:10px;
      border:1px solid var(--border);
      border-radius:14px;
      padding:11px 14px;
      background:rgba(255,255,255,.92);
      box-shadow:0 4px 14px rgba(26,34,51,.05);
    }
    details.progress summary{
      cursor:pointer;
      user-select:none;
      list-style:none;
      display:flex;align-items:center;gap:10px;
      font-size:12px;
      min-height:20px;
    }
    details.progress summary::-webkit-details-marker{display:none}
    details.progress summary::before{
      content:'▸';
      font-size:10px;
      color:var(--brand);
      transition:transform .2s;
      flex:0 0 auto;
    }
    details.progress[open] summary::before{transform:rotate(90deg)}
    .prog-title{
      font-weight:600;
      color:#5c6880;
      flex:0 0 auto;
    }
    .prog-bar{
      flex:1;
      min-width:48px;
      max-width:160px;
      height:4px;
      border-radius:999px;
      background:#edf0f7;
      overflow:hidden;
    }
    .prog-bar-fill{
      display:block;
      height:100%;
      width:0;
      border-radius:999px;
      background:linear-gradient(90deg,var(--brand),var(--brand2));
      transition:width .5s ease;
    }
    .prog-stat{
      color:var(--muted);
      flex:0 0 auto;
      font-variant-numeric:tabular-nums;
    }
    .prog-status{
      flex:0 0 auto;
      padding:2px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:600;
      line-height:1.5;
    }
    .prog-status.st-run{background:#e9f0ff;color:#2563eb}
    .prog-status.st-done{background:#e5f8ee;color:#16a34a}
    .prog-status.st-fail{background:#fdecec;color:#dc2626}
    .prog-status.st-wait{background:#f1f3f9;color:#8a94a8}
    .progress ul{
      margin:10px 0 2px 5px;
      padding:0 0 0 4px;
      list-style:none;
      position:relative;
    }
    .progress ul::before{
      content:'';
      position:absolute;
      left:9px;
      top:10px;
      bottom:10px;
      width:2px;
      border-radius:2px;
      background:#edf0f7;
    }
    .progress li{
      position:relative;
      margin:0;
      padding:3px 0 3px 24px;
      font-size:12px;
      color:#5c6880;
      line-height:1.6;
    }
    .progress li::before{
      content:'';
      position:absolute;
      left:4px;
      top:8px;
      width:12px;height:12px;
      border-radius:50%;
      background:#fff;
      border:2px solid #d8deeb;
      box-sizing:border-box;
      z-index:1;
    }
    .progress li.done{color:#3d4a63}
    .progress li.done::before{
      content:'✓';
      background:#16a34a;
      border-color:#16a34a;
      color:#fff;
      font-size:8px;
      font-weight:700;
      line-height:1.2;
      text-align:center;
    }
    .progress li.running{color:#2563eb;font-weight:500}
    .progress li.running::before{
      background:#fff;
      border-color:#3d7bff;
      animation:ringPulse 1.4s ease-in-out infinite;
    }
    .progress li.running::after{
      content:'';
      position:absolute;
      left:7px;
      top:11px;
      width:6px;height:6px;
      border-radius:50%;
      background:var(--brand);
      animation:ringPulse 1.4s ease-in-out infinite;
      z-index:1;
    }
    @keyframes ringPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(61,123,255,.35)}
      50%{box-shadow:0 0 0 4px rgba(61,123,255,0)}
    }
    .progress li.empty{color:var(--muted)}
    .progress li.empty::before{display:none}

    .answer-images{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .answer-images img{
      display:block;
      max-width:min(100%, 600px);
      max-height:600px;
      width:auto;
      height:auto;
      border-radius:14px;
      border:1px solid var(--border);
      box-shadow:0 12px 28px rgba(26,34,51,.12);
      background:#fff;
    }
    .answer-images a{
      font-size:12px;
      color:var(--brand);
      text-decoration:none;
      word-break:break-all;
    }
    .answer-images a:hover{text-decoration:underline}

    .typing{
      display:inline-flex;gap:6px;align-items:center;
      padding:6px 2px;
    }
    .dot{
      width:8px;height:8px;border-radius:50%;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.5}
      40%{transform:translateY(-6px);opacity:1}
    }

    /* ===== 输入区 ===== */
    .composer-wrap{
      flex:0 0 auto;
      padding:6px clamp(14px,4vw,28px) 12px;
      background:linear-gradient(180deg, rgba(244,246,251,0), var(--bg) 45%);
    }
    .composer{
      width:100%;
      max-width:900px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:flex-end;
      background:#fff;
      border:1px solid var(--border);
      border-radius:22px;
      padding:10px 10px 10px 18px;
      box-shadow:0 14px 40px rgba(26,34,51,.10);
      transition:border-color .2s, box-shadow .2s;
    }
    .composer:focus-within{
      border-color:rgba(61,123,255,.55);
      box-shadow:0 0 0 4px var(--ring), 0 14px 40px rgba(26,34,51,.10);
    }
    textarea{
      flex:1;
      resize:none;
      min-height:44px;
      max-height:160px;
      padding:10px 0;
      border:none;
      background:transparent;
      outline:none;
      font-size:15px;
      line-height:1.55;
      font-family:inherit;
      color:var(--text);
    }
    textarea::placeholder{color:#aab3c5}
    .send{
      height:44px;
      padding:0 24px;
      border:none;
      border-radius:15px;
      cursor:pointer;
      font-size:14px;
      font-weight:600;
      letter-spacing:2px;
      color:#fff;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 8px 18px rgba(61,123,255,.32);
      transition:transform .15s, box-shadow .15s, opacity .15s;
      flex:0 0 auto;
    }
    .send:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 24px rgba(61,123,255,.4)}
    .send:active:not(:disabled){transform:translateY(0)}
    .send:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
    .hint{
      width:100%;
      max-width:900px;
      margin:10px auto 0;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }
    .kbd{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
      font-size:11px;
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:6px;
      background:#fff;
      color:#3b4a5a;
      box-shadow:0 1px 0 var(--border);
    }

    /* ===== 响应式 ===== */
    @media (max-width:768px){
      .title span{display:none}
      .msg{gap:9px}
      .avatar{width:32px;height:32px;border-radius:10px;font-size:8px}
      .bubble{max-width:88%;font-size:14px}
      .msg.bot .bubble{max-width:100%}
    }
    @media (max-width:560px){
      .pill{display:none}
      .switch-label{display:none}
      .btn{padding:8px 12px;font-size:12px}
      .logo{width:34px;height:34px;font-size:15px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">金</div>
      <div class="title">
        <strong>金融标准化知识库</strong>
        <span id="subTitle">在线 · 可查询知识库与联网信息</span>
      </div>
    </div>
    <div class="top-actions">
      <label class="stream-switch">
        <input type="checkbox" id="streamToggle" checked>
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">流式输出</span>
      </label>
      <span class="pill" id="apiPill">API: 未连接</span>
      <button class="btn" id="btnClear">清空对话</button>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="dayline">今天</div>
    <div class="msg bot">
      <div class="avatar bot">小金</div>
      <div>
        <div class="bubble">你好，我是金融标准化知识库客服,小金。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
        <div class="meta">提示：可以问“如何使用万用表测量电压？”</div>
      </div>
    </div>
  </main>

  <footer class="composer-wrap">
    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </footer>

  <script>

    // 模拟后端API地址
    const API_BASE = 'http://127.0.0.1:8001';

    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    //const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    // Session ID Logic
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
      // 简单判断：路径部分以图片后缀结尾
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
      // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      
      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        // 简单清洗可能混入的结尾
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      // 常见“需要看图/见图/如下图”的表述
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      
      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      
      // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
      // 或者从文本里提取到了图片 URL
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);
      
      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
      // 注意：这里做个并集可能更好，防止漏掉
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">小金</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">小金</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary><span class="prog-title">阶段进度</span><span class="prog-status st-wait">等待中</span></summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const statusClassMap = {
        'processing': 'run',
        'completed': 'done',
        'failed': 'fail',
        'pending': 'wait',
      };
      const displayStatus = statusMap[status] || status || 'unknown';
      const statusClass = statusClassMap[status] || 'wait';

      // 迷你进度条：已完成步骤 / 总步骤
      const totalSteps = totalDone + totalRun;
      let pct = totalSteps > 0 ? Math.round(totalDone / totalSteps * 100) : 0;
      if(status === 'completed') pct = 100;
      if(status === 'failed' && totalSteps === 0) pct = 0;

      summary.innerHTML = `
        <span class="prog-title">阶段进度</span>
        <span class="prog-bar"><span class="prog-bar-fill" style="width:${pct}%"></span></span>
        <span class="prog-stat">${totalDone}/${totalSteps} 完成</span>
        <span class="prog-status st-${statusClass}">${escapeHtml(displayStatus)}</span>
      `;

      ul.innerHTML = '';
      if(totalDone === 0 && totalRun === 0){
        ul.insertAdjacentHTML('beforeend', '<li class="empty">暂无进度</li>');
      }else{
        for(const line of done){
          ul.insertAdjacentHTML('beforeend', `<li class="done">${escapeHtml(line)}</li>`);
        }
        for(const line of running){
          ul.insertAdjacentHTML('beforeend', `<li class="running">${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open'); // 完成后自动收起
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        // 保留首条欢迎消息，其余先清空再渲染历史
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){
          // 轮询错误不立刻终止，让用户稍后重试
        }
      }, 1200);
    }

    async function onSend(){
      console.log('[perf] A onSend start', performance.now());
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        console.log('[perf] B submitQuery start', performance.now(), { isStream });
        const data = await submitQuery(text);
        console.log('[perf] B submitQuery end', performance.now(), data);
        
        // 渲染初始状态
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          // 非流式：直接拿到结果
          // data: { session_id, answer, done_list, error, message }
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        // 流式：SSE
        const { session_id } = data; // 此时 backend 返回 session_id
        
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }
        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        console.log('[perf] C EventSource created', performance.now(), { session_id });
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            // 当进度状态已完成时，提前结束“...”等待态
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              // 防止后端未发送 final 导致按钮一直禁用
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              // 即使后端未发送 final，也尽可能在流式过程中渲染图片
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            // 流式 delta 可能不包含“【图片】/图片列表”，最终包的 d.answer 才是完整答案；优先使用 d.answer
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){

          }
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('final_answer', (e) => {
           // 响应用户的 final_answer 信号，确保图片渲染
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;
      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      // 清空除首条欢迎消息外的内容
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    apiHealth();
    setInterval(apiHealth, 30000);
    console.log('加载当前会话的历史聊天记忆11');
    loadHistory();
    console.log('加载当前会话的历史聊天记忆22');
    setTimeout(() => inputEl.focus(), 200);
  </script>
