[project]
name = "aipaas-storage"
version = "0.1.0"
description = "AIPaaS 存储层（MongoDB / MySQL / MinIO / Kubernetes 客户端）"
requires-python = ">=3.12"
dependencies = [
    "aipaas-common",
    "pymongo>=4.18.2",
    "minio>=7.2.20",
    "sqlalchemy>=2.0.0",
    "kubernetes>=30.0.0",
]

[tool.uv.sources]
aipaas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_storage"]
