# =============================================================================
# AIPaaS 五级编排 · 第 4 级：Java 网关与管理平台
# -----------------------------------------------------------------------------
# 依赖：第 3 级 docker-compose-python.yaml（含第 1、2 级）
# 新增：platform-db-init（一次性）/ platform-management / platform-gateway / apisix
#
# platform-management：登录、用户与 RBAC、知识库、文档、审计落库、内容策略、
#   系统配置、导入任务，持有数据库/Flyway/MinIO/完整密钥；只在容器网络内 expose。
# platform-gateway：唯一 Java 对外入口，负责 JWT 验签、撤销与用户状态校验、
#   身份头治理、管理请求代理、问答安全编排与审计事件发布。
# apisix：OpenResty 网关，路由配置存放在第 1 级 etcd 的 /apisix 前缀下，
#   配置文件见 deploy/docker/apisix/apisix_conf/config.yaml。
#
# 数据库使用核心 PostgreSQL 实例中的独立 PLATFORM_DB，不与 Nacos 表混用。
# 首次启动前在 .env 设置 PLATFORM_BOOTSTRAP_ADMIN_PASSWORD，然后执行：
#   docker compose -f docker-compose-java.yaml up -d --build
#   docker compose -f docker-compose-java.yaml ps
#   docker compose -f docker-compose-java.yaml down
# =============================================================================

include:
  - docker-compose-python.yaml

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
      tag: "{{.Name}}/{{.ID}}"

x-restart: &default-restart
  restart: unless-stopped

services:
  # 幂等创建 Java 平台独立数据库，兼容已存在 PostgreSQL 数据卷的升级场景。
  platform-db-init:
    image: pgvector/pgvector:pg17
    container_name: aipaas-platform-db-init
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nacos}
      PGPASSWORD: ${POSTGRES_PASSWORD:-nacos}
      PLATFORM_DB: ${PLATFORM_DB:-aipaas}
    command:
      - sh
      - -c
      # 注意：pgvector:pg17 自带的 psql 在 -c 单串模式下既不展开 :变量 也不解析
      # \gexec 元命令（实测报 syntax error at or near ":" / "\"），故改用 stdin
      # 管道投递，让 psql 以脚本模式处理：变量替换与 \gexec 均正常工作。
      - >
        printf "SELECT format('CREATE DATABASE %%I', :'db_name')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name') \\gexec\n"
        | psql -v ON_ERROR_STOP=1 -h postgres -U "$${POSTGRES_USER}" -d postgres
        --set=db_name="$${PLATFORM_DB}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    <<: *default-logging

  # 管理服务：业务数据、RBAC、文档与导入任务、审计落库、内容策略与系统配置。
  platform-management:
    build:
      context: ../../javaplat
      dockerfile: apps/platform-management/Dockerfile
    image: aipaas/platform-management:${IMAGE_TAG:-latest}
    container_name: aipaas-platform-management
    environment:
      AIPAAS_ENV: ${APP_ENV:-devcompany}
      AIPAAS_API_VERSION: v1
      AIPAAS_CONTRACT_VERSION: ${AIPAAS_CONTRACT_VERSION:-1.1.0-p0}
      AIPAAS_DB_URL: jdbc:postgresql://postgres:5432/${PLATFORM_DB:-aipaas}
      AIPAAS_DB_USERNAME: ${POSTGRES_USER:-nacos}
      AIPAAS_DB_PASSWORD: ${POSTGRES_PASSWORD:-nacos}
      AIPAAS_MINIO_ENDPOINT: http://minio:9000
      AIPAAS_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      AIPAAS_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AIPAAS_MINIO_BUCKET: ${PLATFORM_MINIO_BUCKET:-aipaas}
      AIPAAS_BOOTSTRAP_ADMIN_PASSWORD: ${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:?Set PLATFORM_BOOTSTRAP_ADMIN_PASSWORD before starting level 4}
      AIPAAS_AUDIT_RETENTION_DAYS: ${AIPAAS_AUDIT_RETENTION_DAYS:-180}
      AIPAAS_REQUEST_LOG_RETENTION_DAYS: ${AIPAAS_REQUEST_LOG_RETENTION_DAYS:-30}
      AIPAAS_REQUEST_LOG_PATH: /var/log/aipaas
      AIPAAS_TRACE_MAX_SPANS: ${AIPAAS_TRACE_MAX_SPANS:-20000}
      AIPAAS_PARSE_SERVICE_URL: http://app-ingest-worker:${APP_INGEST_WORKER_PORT:-8001}
      AIPAAS_TLS_CERTIFICATE_PATH: /etc/aipaas/tls/tls.crt
      # 完整密钥只在管理服务内；只向网关导出 JWT 验证密钥。
      AIPAAS_KEYRING_PATH: /var/lib/aipaas/security/keyring.json
      AIPAAS_JWT_VERIFY_EXPORT_PATH: /var/lib/aipaas/jwt-verify/jwt-secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AIPAAS_GATEWAY_STATE_SYNC_INTERVAL_MS: ${AIPAAS_GATEWAY_STATE_SYNC_INTERVAL_MS:-60000}
      AIPAAS_GATEWAY_AUDIT_POLL_INTERVAL_MS: ${AIPAAS_GATEWAY_AUDIT_POLL_INTERVAL_MS:-1000}
      TZ: Asia/Shanghai
    expose:
      - "8080"
    volumes:
      - platform-security-keys:/var/lib/aipaas/security
      - platform-upload-temp:/var/lib/aipaas/uploads
      - platform-request-logs:/var/log/aipaas
      - platform-tls:/etc/aipaas/tls:ro
      - platform-jwt-verify:/var/lib/aipaas/jwt-verify
    depends_on:
      platform-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-ingest-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    <<: [*default-restart, *default-logging]

  # 统一入口：认证、身份头治理、管理代理、问答安全编排与审计事件发布。
  platform-gateway:
    build:
      context: ../../javaplat
      dockerfile: apps/platform-gateway/Dockerfile
    image: aipaas/platform-gateway:${IMAGE_TAG:-latest}
    container_name: aipaas-platform-gateway
    environment:
      AIPAAS_ENV: ${APP_ENV:-devcompany}
      AIPAAS_API_VERSION: v1
      AIPAAS_CONTRACT_VERSION: ${AIPAAS_CONTRACT_VERSION:-1.1.0-p0}
      PLATFORM_MANAGEMENT_URL: http://platform-management:8080
      PLATFORM_MANAGEMENT_CONNECT_TIMEOUT: ${PLATFORM_MANAGEMENT_CONNECT_TIMEOUT:-PT5S}
      PLATFORM_MANAGEMENT_READ_TIMEOUT: ${PLATFORM_MANAGEMENT_READ_TIMEOUT:-PT180S}
      AIPAAS_CHAT_SERVICE_URL: http://app-query-worker:${APP_QUERY_WORKER_PORT:-8002}
      AIPAAS_CHAT_CONNECT_TIMEOUT: ${AIPAAS_CHAT_CONNECT_TIMEOUT:-PT5S}
      AIPAAS_CHAT_READ_TIMEOUT: ${AIPAAS_CHAT_READ_TIMEOUT:-PT120S}
      AIPAAS_JWT_VERIFY_SECRET_FILE: /var/lib/aipaas/jwt-verify/jwt-secret
      AIPAAS_TRACE_MAX_SPANS: ${AIPAAS_TRACE_MAX_SPANS:-20000}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: Asia/Shanghai
    ports:
      - "${PLATFORM_GATEWAY_PORT:-8081}:8080"
    volumes:
      # 只读挂载 JWT 验证密钥；不挂载业务数据、MinIO、AES 或审计密钥。
      - platform-jwt-verify:/var/lib/aipaas/jwt-verify:ro
    depends_on:
      platform-management:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-query-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    <<: [*default-restart, *default-logging]

  # API 网关：路由与上游存储在第 1 级 etcd（/apisix 前缀），配置只读挂载。
  # 管理 API（9180）用于维护路由；业务流量走 9080，TLS 走 9443。
  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.21.0-debian}
    container_name: aipaas-apisix
    volumes:
      - ./apisix/apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "${APISIX_HTTP_PORT:-9080}:9080"
      - "${APISIX_HTTPS_PORT:-9443}:9443"
      # Admin API 只绑定本机回环，禁止公网直接操作路由与上游
      - "127.0.0.1:${APISIX_ADMIN_PORT:-9180}:9180"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      etcd:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    <<: [*default-restart, *default-logging]

volumes:
  platform-security-keys:
  platform-upload-temp:
  platform-request-logs:
  # 管理服务导出的 JWT 验证密钥，仅平台网关只读使用。
  platform-jwt-verify:
  # 与第 5 级 frontend 共用证书；frontend 可为开发环境生成自签证书。
  platform-tls:
