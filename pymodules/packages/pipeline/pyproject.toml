[project]
name = "aipaas-pipeline"
version = "0.1.0"
description = "AIPaaS RAG 流程编排基类与共享管线能力"
requires-python = ">=3.12"
dependencies = [
    "aipaas-common",
]

[tool.uv.sources]
aipaas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_pipeline"]
