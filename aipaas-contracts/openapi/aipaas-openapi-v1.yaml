openapi: 3.1.0

info:
  title: AIPaaS 金融标准 RAG 平台 API
  summary: P0（第 1 期 · 引擎奠基）冻结契约，覆盖 10 个功能域、44 项 P0 功能。
  version: 1.1.0-p0
  description: |
    # 契约定位
    本文件是 AIPaaS P0 阶段跨语言接口的单一事实来源（Single Source of Truth）。
    Java（`javaplat/`）与 Python（`pymodules/`）实现、Web（`web/`）调用、Mock（`aipaas-contracts/mock/`）
    均以本文件为准。契约冻结后，任何破坏性变更必须走版本兼容流程（见 `VERSIONING.md` 与
    `x-compatibility-policy`）。

    # 统一约定
    - **BasePath**：业务接口统一为 `/api/v1`；`/healthz`、`/readyz` 为基础设施探针，不带前缀、不包信封。
    - **响应信封**：`{code, message, data, traceId}`。成功 `code = "OK"`；失败 `code` 采用分段错误码。
    - **错误码分段**：`AUTH.*` / `PERM.*` / `PARAM.*` / `BIZ.*` / `SYS.*` / `RATE.*`，与 HTTP 状态码映射见
      `x-error-code-policy`。
    - **鉴权**：`Authorization: Bearer <JWT>`。P0 仅账号密码登录（#166），SSO 属 P1，不实现。
    - **链路标识**：请求可带 `X-Request-Id`；服务端始终回写 `X-Trace-Id`，并与信封 `traceId` 一致。
    - **分页**：`page` 从 1 开始，`pageSize` 默认 20、最大 100；响应 `data = {items,total,page,pageSize}`。
    - **幂等**：写接口以 `Idempotency-Key` 去重，24h 内同 key + 同请求体返回首次结果；
      同 key 不同请求体返回 409 `BIZ.CONFLICT`。需要幂等的接口标记 `x-idempotency: required`。
    - **SSE**：`text/event-stream`，事件名固定为 `meta` / `delta` / `citation` / `done` / `error` / `ping`；
      每条事件 `data:` 为单行 JSON；流结束以 `done` 或 `error` 收尾。
    - **多租户**：所有领域模型自 P0 起携带 `tenantId`（默认租户 `default`），为 P1 #131 预留。
    - **时间**：RFC 3339 UTC 字符串；金额/大小类字段使用整数（字节）。

    # 版本与兼容策略
    - URL 主版本：`/api/v1`。新增可选字段、新增接口、新增错误码分段内码为**兼容变更**。
    - 删除/重命名字段、收紧校验、修改语义、删除枚举值为**破坏性变更**：
      至少提前 **2 个次版本**通过 `Deprecation` 与 `Sunset` 响应头告警（对齐 NFR #31）。
    - 客户端必须容忍未知枚举值与未知响应字段（前向兼容），服务端不得依赖客户端忽略行为。
    - P1/P2 字段在本契约中以 `nullable` + `x-reserved-for` 声明，P0 不参与业务计算。

    # P0 明确不建设
    - 统一 API 网关（Spring Cloud Gateway、分布式限流、灰度路由）→ P1 #204–#210；
      P0 仅由反向代理 + Resilience4j 提供最小限流/熔断/降级。
    - 混合检索（BM25）、Cross-Encoder 重排、多轮对话、SSO、多租户隔离、定时调度（XXL-JOB）→ P1。
    - P0 任务调度仅事件驱动队列；`/ingest/tasks` 为幂等状态机，不做 cron。
  contact:
    name: AIPaaS 架构组
    url: https://aipaas.local/docs/architecture/01-p0-api-review.md
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-contract-status: frozen
  x-p0-feature-count: 44
  x-p0-domains:
    - 数据接入与解析
    - 知识构建与索引
    - 检索引擎
    - 生成与推理
    - 知识治理
    - 安全与合规
    - 可观测与质量评估
    - 平台与管理
    - 用户界面与体验
    - 模型服务
  x-compatibility-policy:
    breaking-change-notice-versions: 2
    deprecation-headers: [Deprecation, Sunset, Link]
    unknown-enum-tolerance: required
    additive-change-compatible: true
  x-error-code-policy:
    pattern: '^(AUTH|PERM|PARAM|BIZ|SYS|RATE)\.[A-Z0-9_]+$'
    http-mapping:
      AUTH: 401
      PERM: 403
      PARAM: 400
      BIZ: 404/409/422
      SYS: 500/501/503
      RATE: 429

servers:
  - url: https://localhost:18443/api/v1
    description: P0 统一 HTTPS 入口（Nginx 终止 TLS，Java 平台统一鉴权与安全检查）
  - url: http://localhost:4010/api/v1
    description: 契约 Mock Server（仅用于前端/后端独立联调，不承载真实数据）

security:
  - bearerAuth: []

tags:
  - name: 系统
    description: 探针、契约元信息（不承载业务）
  - name: 数据接入与解析
    description: 上传、接入任务、清洗、PDF/Word/Excel/Markdown 解析（P0 #1/#10/#14/#18/#19/#20/#21/#252）
  - name: 知识构建与索引
    description: 分块、向量化、索引构建、元数据标注（P0 #36/#37/#44/#49/#57/#404）
  - name: 检索引擎
    description: 查询理解、向量召回、权限过滤（P0 #63/#70/#88）
  - name: 生成与推理
    description: LLM 调用、Prompt、幻觉抑制、拒答、格式化、流式、标准简介、标准问答（P0 #98/#103/#106/#108/#110/#113/#114/#405/#407）
  - name: 知识治理
    description: 知识库/文档管理、权限、审计、条目化导出（P0 #130/#134/#139/#144/#406）
  - name: 安全与合规
    description: 身份认证、传输/存储加密态势、双向内容审核、Prompt 注入防护（P0 #153/#154/#156/#157/#159/#166）
  - name: 可观测与质量评估
    description: 请求日志、全链路 Trace、基础指标（P0 #173/#175/#177）
  - name: 平台与管理
    description: 用户、系统配置、管理总览（P0 #193）
  - name: 用户界面与体验
    description: 对话界面、知识库界面所需配置与能力选择器（P0 #242/#246/#402）
  - name: 模型服务
    description: LLM 提供商、模型调用、Embedding 服务（P0 #98/#44）

x-owner-map:
  java: [系统, 数据接入与解析, 知识治理, 安全与合规, 可观测与质量评估, 平台与管理, 用户界面与体验]
  python: [知识构建与索引, 检索引擎, 生成与推理, 模型服务]
  web: [用户界面与体验]
  note: Java 对外统一暴露 /api/v1；Python 仅在直连调试端口暴露同名契约，生产流量由 Java 反向代理。

paths:

  # =========================================================================
  # 系统
  # =========================================================================
  /healthz:
    get:
      tags: [系统]
      operationId: healthz
      summary: 存活探针
      description: 返回 200 即进程存活。不鉴权、不包信封、不写审计。
      security: []
      x-owner: all
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: UP}
  /readyz:
    get:
      tags: [系统]
      operationId: readyz
      summary: 就绪探针
      description: 返回 200 表示可接收流量；依赖不可用时返回 503 并列出 checks。
      security: []
      x-owner: all
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /system/info:
    get:
      tags: [系统]
      operationId: getSystemInfo
      summary: 契约与运行时元信息
      x-owner: java
      x-p0-feature: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfoResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}

  # =========================================================================
  # 安全与合规（认证）
  # =========================================================================
  /auth/login:
    post:
      tags: [安全与合规]
      operationId: login
      summary: 账号密码登录（P0 #166）
      description: |
        用户名密码认证，密码强度校验，失败计数与锁定基线；认证失败写审计。
        会话超时由 JWT `exp` 控制（P0 基线 30 分钟）。SSO/OAuth2 属 P1，不在本契约。
      security: []
      x-owner: java
      x-p0-feature: ['#166']
      x-permission: none
      x-audit: {required: true, actions: [auth.login, auth.login.failed]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/ServerError'}
  /auth/refresh:
    post:
      tags: [安全与合规]
      operationId: refreshToken
      summary: 刷新访问令牌并轮换刷新令牌（P0 #166）
      description: 刷新令牌一次性使用；轮换后旧令牌立即失效。绝对会话期默认 7 天，访问令牌默认 30 分钟。
      security: []
      x-owner: java
      x-p0-feature: ['#166']
      x-permission: none
      x-audit: {required: true, actions: [auth.token.refresh, auth.token.refresh.failed]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRefreshRequest'}
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/logout:
    post:
      tags: [安全与合规]
      operationId: logout
      summary: 注销会话
      x-owner: java
      x-p0-feature: ['#166']
      x-permission: authenticated
      x-audit: {required: true, actions: [auth.logout]}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [安全与合规]
      operationId: getCurrentUser
      summary: 当前用户与权限
      x-owner: java
      x-p0-feature: ['#166', '#139']
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUserResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /permissions:
    get:
      tags: [知识治理]
      operationId: listPermissions
      summary: 权限点清单（角色配置界面用）
      x-owner: java
      x-p0-feature: ['#139']
      x-permission: role:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /roles:
    get:
      tags: [知识治理]
      operationId: listRoles
      summary: 角色列表
      x-owner: java
      x-p0-feature: ['#139']
      x-permission: role:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RolePageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [知识治理]
      operationId: createRole
      summary: 创建角色
      x-owner: java
      x-p0-feature: ['#139']
      x-permission: role:write
      x-audit: {required: true, actions: [role.create]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleCreateRequest'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /roles/{roleId}/permissions:
    put:
      tags: [知识治理]
      operationId: updateRolePermissions
      summary: 更新角色-权限矩阵（≤1 分钟生效）
      x-owner: java
      x-p0-feature: ['#139']
      x-permission: role:write
      x-audit: {required: true, actions: [role.permission.update]}
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RolePermissionUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # =========================================================================
  # 数据接入与解析
  # =========================================================================
  /knowledge-bases:
    get:
      tags: [知识治理]
      operationId: listKnowledgeBases
      summary: 知识库列表与状态（P0 #130）
      x-owner: java
      x-p0-feature: ['#130']
      x-permission: kb:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema: {type: string, maxLength: 100}
        - name: domain
          in: query
          description: 标准域（P0 精确匹配）
          schema: {type: string, nullable: true}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeBasePageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [知识治理]
      operationId: createKnowledgeBase
      summary: 创建知识库（P0 #130）
      x-owner: java
      x-p0-feature: ['#130']
      x-permission: kb:write
      x-audit: {required: true, actions: [kb.create]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeBaseCreateRequest'}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeBaseResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /knowledge-bases/{kbId}:
    get:
      tags: [知识治理]
      operationId: getKnowledgeBase
      summary: 知识库详情
      x-owner: java
      x-p0-feature: ['#130']
      x-permission: kb:read
      parameters:
        - $ref: '#/components/parameters/KbId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeBaseResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [知识治理]
      operationId: updateKnowledgeBase
      summary: 重命名/修改知识库配置
      x-owner: java
      x-p0-feature: ['#130']
      x-permission: kb:write
      x-audit: {required: true, actions: [kb.update]}
      parameters:
        - $ref: '#/components/parameters/KbId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeBaseUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeBaseResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [知识治理]
      operationId: deleteKnowledgeBase
      summary: 删除知识库（不影响其他库）
      x-owner: java
      x-p0-feature: ['#130']
      x-permission: kb:write
      x-audit: {required: true, actions: [kb.delete]}
      parameters:
        - $ref: '#/components/parameters/KbId'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /knowledge-bases/{kbId}/documents:
    post:
      tags: [数据接入与解析]
      operationId: uploadDocument
      summary: 上传金融标准文档（P0 #1 / #252）
      description: |
        支持 pdf/doc/docx/xls/xlsx/ppt/pptx/md/txt，首期 PDF 为主。服务端做格式与大小校验、
        上传权限校验（实时权限，越权拦截并告警），保存对象存储后立即创建接入任务。
        大文件（≥100MB）走分片/流式上传，不中断。
      x-owner: java
      x-p0-feature: ['#1', '#252']
      x-permission: doc:upload
      x-audit: {required: true, actions: [doc.upload, permission.denied]}
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/KbId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 单文件，≤ 100MB（P0 上限；P1 #253 扩展 GB 级）
                standardNo:
                  type: string
                  description: 可选，标准编号（如 JR/T 0088）
                autoParse:
                  type: boolean
                  default: true
                  description: 上传后是否自动进入解析流程（默认 true）
      responses:
        '202':
          description: 已接收并创建接入任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentUploadResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  /knowledge-bases/{kbId}/documents/uploads:init:
    post:
      tags: [数据接入与解析]
      operationId: initDocumentUpload
      summary: 分片上传初始化（P0 #1；P1 #253 断点续传复用同一路径）
      description: |
        客户端提交 fileName、sizeBytes、fileHash（SHA-256）。服务端按 fileHash 幂等：
        已存在同哈希文档时返回 duplicate=true 与 documentId；存在未完成会话时返回
        receivedParts/missingParts/offset 以支持续传。字段与路径在 P1 #253 保持不变。
      x-owner: java
      x-p0-feature: ['#1']
      x-permission: doc:upload
      x-audit: {required: true, actions: [doc.upload]}
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/KbId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentUploadInitRequest'}
      responses:
        '200':
          description: 会话已创建或复用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentUploadSessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  /knowledge-bases/{kbId}/documents/uploads/{uploadId}:
    get:
      tags: [数据接入与解析]
      operationId: getDocumentUpload
      summary: 查询分片进度与缺失分片（P0 #1；P1 #253 断点续传）
      x-owner: java
      x-p0-feature: ['#1']
      x-permission: doc:upload
      parameters:
        - $ref: '#/components/parameters/KbId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentUploadSessionResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /knowledge-bases/{kbId}/documents/uploads/{uploadId}/parts/{partNo}:
    put:
      tags: [数据接入与解析]
      operationId: uploadDocumentPart
      summary: 上传单个分片（P0 #1；P1 #253 断点续传）
