[project]
name = "aipaas-mcp-agent"
version = "0.1.0"
description = "AIPaaS LLM 接入层（MCP）"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aipaas-common",
    "mcp>=1.19.0,<2",
    "openai-agents<0.20.0",
]

[tool.uv.sources]
aipaas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_mcp_agent"]
