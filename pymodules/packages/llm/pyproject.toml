[project]
name = "aipaas-llm"
version = "0.1.0"
description = "AIPaaS LLM 接入层（LLM 客户端、嵌入、重排、MCP）"
requires-python = ">=3.12"
dependencies = [
    "aipaas-common",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-huggingface",
    "dashscope>=1.27.7",
    "mcp<2",
    "openai-agents==0.23.1",
    "FlagEmbedding>=1.4.2",
    "pymilvus[model]>=3.0.2",
]

[tool.uv.sources]
aipaas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_llm"]
