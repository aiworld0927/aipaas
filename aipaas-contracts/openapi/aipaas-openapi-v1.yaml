          application/json:
            schema: {$ref: '#/components/schemas/ChatRequest'}
      responses:
        '200':
          description: 回答（含引用）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/ServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /chat/stream:
    post:
      tags: [生成与推理]
      operationId: chatStream
      summary: 金融标准问答（SSE 流式，P0 #113）
      description: |
        `Content-Type: text/event-stream`。事件顺序：
        1. `meta`：answerId/traceId/retrievalMode；
        2. 0..n 个 `citation`：命中的条款引用；
        3. n 个 `delta`：增量 token（首 token ≤1s，对齐 NFR #3）；
        4. `done`：最终状态与用量；或 `error`。
        断线重连：每条事件带 `id: <streamKey>:<seq>`；客户端断线后原样回传
        `Last-Event-ID`，服务端从该序号之后续传（P0 单实例内存缓冲，缓冲过期则重新生成）。
        客户端收到 `done.content` 后应以该正文覆盖流式预览，保证最终答案完整且与非流式一致。
        与 `/chat` 相同，Java 统一入口在任何内部问答调用前完成输入违规与 Prompt 注入检查。
      x-owner: java
      x-p0-feature: ['#113', '#407', '#108', '#156', '#159']
      x-permission: chat:use
      x-audit: {required: true, actions: [chat.query, security.input.blocked, security.prompt_injection.blocked]}
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string}
          description: SSE 断线续传序号
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatRequest'}
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema: {type: string}
              examples:
                stream:
                  summary: 完整事件序列
                  value: |
                    event: meta
                    data: {"answerId":"ans_1","traceId":"tr_1","retrievalMode":"vector","startedAt":"2026-11-17T10:00:00Z"}

                    event: citation
                    data: {"answerId":"ans_1","citations":[{"chunkId":"c1","documentId":"d1","standardNo":"JR/T 0088","clauseNo":"4.1.1","pageNo":12,"score":0.92}]}

                    event: delta
                    data: {"answerId":"ans_1","seq":1,"delta":"根据"}

                    event: done
                    data: {"answerId":"ans_1","finishReason":"STOP","refused":false,"usage":{"promptTokens":900,"completionTokens":120,"totalTokens":1020}}

          x-sse-event-schemas:
            meta: {$ref: '#/components/schemas/SseMeta'}
            delta: {$ref: '#/components/schemas/SseDelta'}
            citation: {$ref: '#/components/schemas/SseCitation'}
            done: {$ref: '#/components/schemas/SseDone'}
            error: {$ref: '#/components/schemas/SseError'}
            ping: {type: object, properties: {at: {type: string, format: date-time}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/ServerError'}
  /documents/{documentId}/summaries:
