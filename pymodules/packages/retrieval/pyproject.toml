[project]
name = "aipaas-retrieval"
version = "0.1.0"
description = "AIPaaS 检索层（Milvus / ES / Qdrant / Neo4j 适配与重排）"
requires-python = ">=3.12"
dependencies = [
    "aipaas-common",
    "aipaas-llm",
    "pymilvus[model]>=3.0.2",
    "elasticsearch>=8.0.0",
    "neo4j>=5.0.0",
    "qdrant-client>=1.9.0",
]

[tool.uv.sources]
aipaas-common = { workspace = true }
aipaas-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_retrieval"]
