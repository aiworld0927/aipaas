[project]
name = "aipaas-retrieval"
version = "0.1.0"
description = "AIPaaS 检索层（Milvus 适配）"
requires-python = ">=3.12"
dependencies = [
    "aipaas-common",
    "aipaas-model-clients",
    # 向量库客户端（嵌入推理已迁至 model-embedding-worker，不再需要 [model] 本地推理扩展，
    # 该扩展会把 torch 拉进默认依赖树并与根 cpu/gpu 分组索引冲突）
    "pymilvus>=3.0.2",
]

[tool.uv.sources]
aipaas-common = { workspace = true }
aipaas-model-clients = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_retrieval"]
