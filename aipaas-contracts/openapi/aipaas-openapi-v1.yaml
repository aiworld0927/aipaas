              schema: {$ref: '#/components/schemas/RefusalStatsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        P0 使用账号密码登录签发的 JWT（HS256，30 分钟），JWT 仅证明身份与会话有效性。
        每个请求均由服务端实时查询数据库中的用户状态、角色、权限和知识库授权，不采用 JWT 中的历史权限副本；
        权限变更在下一请求生效。P1 SSO/网关统一鉴权不在 P0 范围。

  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      description: 每页条数
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    KbId:
      name: kbId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    PartNo:
      name: partNo
      in: path
      required: true
      description: 分片序号，从 1 开始
      schema: {type: integer, minimum: 1, maximum: 20000}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    BuildId:
      name: buildId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    RoleId:
      name: roleId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        幂等键，UUID/业务唯一串，24h 内有效。同 key + 同请求体返回首次结果；
        同 key + 不同请求体返回 409 `BIZ.CONFLICT`。
      schema: {type: string, minLength: 8, maxLength: 128}

  responses:
    Ok:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OkResponse'
    BadRequest:
      description: 参数错误（PARAM.*）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            invalid:
              value:
                code: PARAM.INVALID
                message: 请求参数不合法
                data: {reason: 'query: must not be blank', retryable: false}
                traceId: tr_01HXYZ
    Unauthorized:
      description: 未认证（AUTH.*）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            unauthenticated:
              value:
                code: AUTH.UNAUTHENTICATED
                message: 未提供有效凭证
                data: {retryable: false}
                traceId: tr_01HXYZ
    Forbidden:
      description: 无权限（PERM.*）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            forbidden:
              value:
                code: PERM.FORBIDDEN
                message: 无权执行该操作
                data: {reason: 'missing permission: doc:upload', retryable: false}
                traceId: tr_01HXYZ
    NotFound:
      description: 资源不存在（BIZ.NOT_FOUND）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            notFound:
              value:
                code: BIZ.NOT_FOUND
                message: 资源不存在
                data: {retryable: false}
                traceId: tr_01HXYZ
    Conflict:
      description: 状态冲突/幂等冲突（BIZ.CONFLICT / BIZ.TASK_NOT_RETRYABLE）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unprocessable:
      description: 业务语义不可处理（BIZ.NO_ANSWER / BIZ.CONTENT_BLOCKED / BIZ.PROMPT_INJECTION）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    PayloadTooLarge:
      description: 文件超过限制（PARAM.FILE_TOO_LARGE）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: 限流（RATE.LIMITED）
      headers:
        Retry-After:
          schema: {type: integer}
          description: 建议重试秒数
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ServerError:
      description: 服务内部错误（SYS.*）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ServiceUnavailable:
      description: 依赖不可用/降级（SYS.DEPENDENCY_UNAVAILABLE / SYS.DEGRADED）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  schemas:

    # ------------------------------------------------------------------
    # 公共信封 / 分页 / 错误
    # ------------------------------------------------------------------
    ApiEnvelope:
      type: object
      description: 统一响应信封
      required: [code, message, data, traceId]
      properties:
        code:
          type: string
          description: 成功固定为 OK；失败为分段错误码（见 x-error-code-policy）
          examples: [OK]
        message: {type: string, description: 人类可读信息}
        data: {description: 业务数据；失败时为 ErrorInfo}
        traceId: {type: string, description: 与响应头 X-Trace-Id 一致}
    ErrorInfo:
      type: object
      properties:
        reason: {type: string, description: 失败原因（不含敏感信息）}
        details:
          type: array
          items: {$ref: '#/components/schemas/ValidationIssue'}
        retryable: {type: boolean, default: false}
        retryAfterSeconds: {type: integer, minimum: 0}
    ErrorEnvelope:
      description: 失败信封
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            code:
              type: string
              pattern: '^(AUTH|PERM|PARAM|BIZ|SYS|RATE)\.[A-Z0-9_]+$'
            data: {$ref: '#/components/schemas/ErrorInfo'}
    ValidationIssue:
      type: object
      required: [field, code, message]
      properties:
        field: {type: string}
        code: {type: string}
        message: {type: string}
    OkResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/OkData'}
    OkData:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean, const: true}
        message: {type: string}
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [UP, DOWN]}
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: {type: string, enum: [UP, DOWN, UNKNOWN]}
              detail: {type: string}
    TenantId:
      type: string
      description: 租户标识；P0 恒为 default，P1 #131 多租户后由鉴权上下文注入
      default: default
      examples: [default]
    ResourceBase:
      type: object
      required: [id, tenantId, createdAt, updatedAt]
      properties:
        id: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PageMeta:
      type: object
      required: [total, page, pageSize]
      properties:
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}

    # ------------------------------------------------------------------
    # 系统
    # ------------------------------------------------------------------
    SystemInfo:
      type: object
      required: [service, version, apiVersion, contractVersion, env, p0FeatureCount, domains]
      properties:
        service: {type: string, examples: [platform-api]}
        version: {type: string, examples: [0.1.0]}
        apiVersion: {type: string, examples: [v1]}
        contractVersion: {type: string, examples: [1.1.0-p0]}
        contractStatus: {type: string, enum: [draft, frozen, deprecated], examples: [frozen]}
        env: {type: string, examples: [dev]}
        p0FeatureCount: {type: integer, const: 44}
        domains:
          type: array
          items: {type: string}
        capabilities:
          type: array
          items: {type: string}
        startedAt: {type: string, format: date-time}
    SystemInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SystemInfo'}

    # ------------------------------------------------------------------
    # 认证 / 角色 / 用户
    # ------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 传输必须 TLS；服务端仅存哈希
        tenantId: {$ref: '#/components/schemas/TenantId'}
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string, description: 一次性刷新令牌；仅在登录/刷新响应返回，禁止写日志}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, description: 秒}
        refreshExpiresIn: {type: integer, description: 秒}
    TokenRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 32, maxLength: 256, description: 禁止写日志}
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/TokenPair'
                - type: object
                  properties:
                    user: {$ref: '#/components/schemas/CurrentUser'}
    CurrentUser:
      type: object
      required: [userId, tenantId, username, displayName, roles, permissions]
      properties:
        userId: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        username: {type: string}
        displayName: {type: string}
        email: {type: string, format: email}
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {type: string}
        defaultTenant: {type: boolean, default: true}
    CurrentUserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/CurrentUser'}
    Permission:
      type: object
      required: [code, name, domain, tenantId]
      properties:
        code: {type: string, examples: ['doc:upload']}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        name: {type: string}
        domain: {type: string}
        description: {type: string}
    PermissionListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: {$ref: '#/components/schemas/Permission'}
    Role:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [code, name, builtIn, permissions, grants]
          properties:
            code: {type: string, examples: [KB_ADMIN]}
            name: {type: string}
            builtIn: {type: boolean}
            permissions:
              type: array
              items: {type: string}
            grants:
              type: array
              items: {$ref: '#/components/schemas/RolePermissionGrant'}
              description: P0 知识库级授权；CLAUSE scope 仅为 P1 预留
            userCount: {type: integer, minimum: 0}
    RolePermissionGrant:
      type: object
      required: [permission, scopeType, scopeId]
      properties:
        permission: {type: string, examples: ['doc:upload']}
        scopeType: {type: string, enum: [KB, CLAUSE], description: 'P0 仅允许 KB；CLAUSE 为 P1 #160 预留'}
        scopeId: {type: string, description: P0 为知识库 ID}
    RoleCreateRequest:
      type: object
      required: [code, name, permissions]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,31}$'}
        name: {type: string, minLength: 1, maxLength: 64}
        permissions:
          type: array
          minItems: 1
          items: {type: string}
        grants:
          type: array
          items: {$ref: '#/components/schemas/RolePermissionGrant'}
          description: 可选；P0 知识库级授权，实时生效
    RolePermissionUpdateRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: {type: string}
        grants:
          type: array
          items: {$ref: '#/components/schemas/RolePermissionGrant'}
    RoleResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Role'}
    RolePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Role'}
    RolePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/RolePage'}
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED]
    User:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [username, displayName, status, roles]
          properties:
            username: {type: string}
            displayName: {type: string}
            email: {type: string, format: email}
            status: {$ref: '#/components/schemas/UserStatus'}
            roles:
              type: array
              items: {type: string}
            lastLoginAt: {type: string, format: date-time, nullable: true}
    UserCreateRequest:
      type: object
      required: [username, displayName, password, roleCodes]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        displayName: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 8, maxLength: 128}
        email: {type: string, format: email}
        roleCodes:
          type: array
          minItems: 1
          items: {type: string}
    UserUpdateRequest:
      type: object
      properties:
        displayName: {type: string, minLength: 1, maxLength: 64}
        email: {type: string, format: email}
        status: {$ref: '#/components/schemas/UserStatus'}
        roleCodes:
          type: array
          items: {type: string}
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/User'}
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/User'}
    UserPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/UserPage'}

    # ------------------------------------------------------------------
    # 知识库 / 文档
    # ------------------------------------------------------------------
    KnowledgeBaseStatus:
      type: string
      enum: [ACTIVE, ARCHIVED, DELETED]
    IndexState:
      type: string
      enum: [EMPTY, BUILDING, READY, FAILED, STALE]
    KnowledgeBase:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [name, status, documentCount, chunkCount, indexStatus]
          properties:
            name: {type: string, minLength: 1, maxLength: 128}
            description: {type: string, maxLength: 1024}
            domain:
              type: string
              nullable: true
              description: 标准域，如 JR / PBOC；P0 支持分类与精确筛选
            standardSystem:
              type: string
              nullable: true
              maxLength: 128
              description: 标准体系，如 JR/T 0088
            config:
              $ref: '#/components/schemas/KnowledgeBaseConfig'
            status: {$ref: '#/components/schemas/KnowledgeBaseStatus'}
            documentCount: {type: integer, minimum: 0}
            chunkCount: {type: integer, minimum: 0}
            indexStatus: {$ref: '#/components/schemas/IndexState'}
            version:
              type: string
              nullable: true
              description: P2 预留：配置版本；P0 可空
              x-reserved-for: P2
            env:
              type: string
              nullable: true
              description: P2 预留：环境标识；P0 可空
              x-reserved-for: P2
    KnowledgeBaseCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 1024}
        domain: {type: string, nullable: true, maxLength: 64}
        standardSystem: {type: string, nullable: true, maxLength: 128}
        config: {$ref: '#/components/schemas/KnowledgeBaseConfig'}
    KnowledgeBaseUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 1024}
        domain: {type: string, nullable: true, maxLength: 64}
        standardSystem: {type: string, nullable: true, maxLength: 128}
        config: {$ref: '#/components/schemas/KnowledgeBaseConfig'}
    KnowledgeBaseConfig:
      type: object
      description: 解析与召回配置；P0 仅知识库级，P1 #160 扩展
      properties:
        chunkSize: {type: integer, minimum: 64, maximum: 2048, default: 512}
        chunkOverlap: {type: integer, minimum: 0, maximum: 512, default: 64}
        retrievalTopK: {type: integer, minimum: 1, maximum: 20, default: 5}
    KnowledgeBaseResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/KnowledgeBase'}
    KnowledgeBasePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/KnowledgeBase'}
    KnowledgeBasePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/KnowledgeBasePage'}
    DocumentStatus:
      type: string
      enum: [QUEUED, PARSING, PROCESSING, READY, FAILED]
      description: 解析中/处理中/已入库/失败；删除即时生效
    DocumentIndexStatus:
      type: string
      enum: [PENDING, BUILDING, INDEXED, FAILED, DELETED]
      description: 文档级索引状态；软删除后立即为 DELETED，物理清理异步重试
    DocumentFormat:
      type: string
      enum: [PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, MD, TXT]
    Document:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [kbId, fileName, format, sizeBytes, status]
          properties:
            kbId: {type: string}
            fileName: {type: string}
            format: {$ref: '#/components/schemas/DocumentFormat'}
            sizeBytes: {type: integer, minimum: 0}
            status: {$ref: '#/components/schemas/DocumentStatus'}
            indexStatus: {$ref: '#/components/schemas/DocumentIndexStatus'}
            chunkCount: {type: integer, minimum: 0}
            progress:
              type: integer
              minimum: 0
              maximum: 100
              description: 最近一次解析任务进度（P0 #246 进度展示）
            standardNo: {type: string, nullable: true}
            uploaderId: {type: string}
            source: {type: string, examples: [manual_upload]}
            pageCount: {type: integer, minimum: 0, nullable: true}
            clauseCount: {type: integer, minimum: 0, nullable: true}
            lastTaskId: {type: string, nullable: true}
            errorCode: {type: string, nullable: true}
            errorMessage: {type: string, nullable: true}
    DocumentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Document'}
    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Document'}
    DocumentPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/DocumentPage'}
    DocumentUploadResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [document, ingestTask]
              properties:
                document: {$ref: '#/components/schemas/Document'}
                ingestTask: {$ref: '#/components/schemas/IngestTask'}
                uploadUrl: {type: string, description: 可选：大文件预签名续传地址}
    DocumentUploadInitRequest:
      type: object
      required: [fileName, sizeBytes, fileHash]
      properties:
        fileName: {type: string, minLength: 1, maxLength: 255}
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 104857600
          description: P0 单文件上限 100MB
        fileHash:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: 文件 SHA-256；服务端在合并时复核
        totalParts:
          type: integer
          minimum: 1
          description: 可选；P1 #253 断点续传复用，缺省按 5MB 计算
        standardNo: {type: string, maxLength: 128}
        autoParse: {type: boolean, default: true}
    DocumentUploadSession:
      type: object
      required: [kbId, fileName, fileHash, sizeBytes, partSize, totalParts, receivedParts, missingParts, offset, status]
      properties:
        uploadId: {type: string, nullable: true, description: 已存在同哈希文档时为 null}
        kbId: {type: string}
        fileName: {type: string}
        fileHash: {type: string}
        sizeBytes: {type: integer}
        partSize: {type: integer, description: P0 固定 5MB}
        totalParts: {type: integer}
        receivedParts:
          type: array
          items: {type: integer}
          description: 已接收分片序号
        missingParts:
          type: array
          items: {type: integer}
          description: 缺失分片序号；P1 #253 断点续传直接复用
        offset:
          type: integer
          minimum: 0
          description: 已连续接收的明文字节数（下一分片起始偏移）
        status:
          type: string
          enum: [UPLOADING, COMPLETED]
        duplicate: {type: boolean, description: 同 fileHash 文档已存在}
        documentId: {type: string, nullable: true, description: duplicate=true 时返回}
        autoParse: {type: boolean}
    DocumentUploadSessionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/DocumentUploadSession'}

    # ------------------------------------------------------------------
    # 接入任务 / 解析 / 清洗
    # ------------------------------------------------------------------
    IngestTaskStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED]
    IngestStage:
      type: string
      enum: [UPLOAD, PARSE, CLEAN, CHUNK, EMBED, INDEX, DONE]
      description: P0 串行阶段；事件驱动推进，无定时调度
    IngestTaskError:
      type: object
      properties:
        code: {type: string, examples: [BIZ.PARSE_FAILED]}
        message: {type: string}
        retryable: {type: boolean}
        stage: {$ref: '#/components/schemas/IngestStage'}
    IngestTask:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [documentId, kbId, status, stage, progress, retryCount]
          properties:
            documentId: {type: string}
            kbId: {type: string}
            status: {$ref: '#/components/schemas/IngestTaskStatus'}
            stage: {$ref: '#/components/schemas/IngestStage'}
            progress: {type: integer, minimum: 0, maximum: 100}
            retryCount: {type: integer, minimum: 0}
            maxRetries: {type: integer, minimum: 0, default: 2}
            error: {$ref: '#/components/schemas/IngestTaskError'}
            queuedAt: {type: string, format: date-time}
            startedAt: {type: string, format: date-time, nullable: true}
            finishedAt: {type: string, format: date-time, nullable: true}
    IngestTaskResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/IngestTask'}
    IngestTaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/IngestTask'}
    IngestTaskPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/IngestTaskPage'}
    IngestTaskEvent:
      type: object
      required: [taskId, status, stage, progress, at]
      properties:
        taskId: {type: string}
        status: {$ref: '#/components/schemas/IngestTaskStatus'}
        stage: {$ref: '#/components/schemas/IngestStage'}
        progress: {type: integer, minimum: 0, maximum: 100}
        code: {type: string, nullable: true}
        message: {type: string, nullable: true}
        at: {type: string, format: date-time}
    SectionNode:
      type: object
      required: [sectionId, title, level]
      properties:
        sectionId: {type: string}
        title: {type: string}
        level: {type: integer, minimum: 1}
        clauseNo: {type: string, nullable: true}
        pageNo: {type: integer, minimum: 1, nullable: true}
        children:
          type: array
          items: {$ref: '#/components/schemas/SectionNode'}
    TableBlock:
      type: object
      required: [tableId, pageNo, rows]
      properties:
        tableId: {type: string}
        pageNo: {type: integer, minimum: 1}
        caption: {type: string, nullable: true}
        headerRows: {type: integer, minimum: 0, default: 1}
        rows:
          type: array
          description: 二维单元格文本，保持原表格结构
          items:
            type: array
            items: {type: string}
    ClauseAnchor:
      type: object
      required: [clauseNo, title, chapterPath, level]
      properties:
        clauseNo: {type: string, examples: ['4.1.1']}
        title: {type: string}
        chapterPath: {type: string, examples: ['4 技术要求 / 4.1 数据安全 / 4.1.1 总则']}
        pageNo: {type: integer, minimum: 1, nullable: true}
        level: {type: integer, minimum: 1}
    ParseResult:
      type: object
      required: [documentId, parser, success, sections, tables, clauseAnchors, pages]
      properties:
        documentId: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        parser: {type: string, examples: [pdf-native, pdf-ocr, docx, xlsx, markdown]}
        success: {type: boolean}
        failureCode: {type: string, nullable: true}
        retryCount: {type: integer, minimum: 0}
        pages: {type: integer, minimum: 0}
        sections:
          type: array
          items: {$ref: '#/components/schemas/SectionNode'}
        tables:
          type: array
          items: {$ref: '#/components/schemas/TableBlock'}
        clauseAnchors:
          type: array
          items: {$ref: '#/components/schemas/ClauseAnchor'}
        parsedAt: {type: string, format: date-time}
    ParseResultResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ParseResult'}
    CleaningDiff:
      type: object
      required: [type, before, after]
      properties:
        type: {type: string, enum: [GARBAGE_REMOVED, ILLEGAL_CHAR_REMOVED, BLANK_LINE_COLLAPSED, HEADER_FOOTER_REMOVED]}
        pageNo: {type: integer, minimum: 1, nullable: true}
        lineNo: {type: integer, minimum: 1, nullable: true}
        before: {type: string}
        after: {type: string}
    CleaningReport:
      type: object
      required: [documentId, beforeChars, afterChars, removedGarbage, removedIllegalChars, collapsedBlankLines, clauseNoPreserved]
      properties:
        documentId: {type: string}
        beforeChars: {type: integer, minimum: 0}
        afterChars: {type: integer, minimum: 0}
        removedGarbage: {type: integer, minimum: 0}
        removedIllegalChars: {type: integer, minimum: 0}
        collapsedBlankLines: {type: integer, minimum: 0}
        clauseNoPreserved: {type: boolean, description: 清洗后条款编号完整性}
        diffs:
          type: array
          items: {$ref: '#/components/schemas/CleaningDiff'}
        generatedAt: {type: string, format: date-time}
    CleaningReportResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/CleaningReport'}

    # ------------------------------------------------------------------
    # 分块 / 条款 / 标准元数据
    # ------------------------------------------------------------------
    ChunkType:
      type: string
      enum: [FIXED, STRUCTURED, CLAUSE]
      description: 固定长度 / 结构化 / 条目化（按条款编号）
    Chunk:
      type: object
      required: [id, tenantId, documentId, kbId, chunkType, chunkIndex, text, tokenCount]
      properties:
        id: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        documentId: {type: string}
        kbId: {type: string}
        chunkType: {$ref: '#/components/schemas/ChunkType'}
        chunkIndex: {type: integer, minimum: 0}
        text: {type: string}
        tokenCount: {type: integer, minimum: 0}
        clauseNo: {type: string, nullable: true}
        chapterPath: {type: string, nullable: true}
        pageNo: {type: integer, minimum: 1, nullable: true}
        securityLevel:
          type: string
          nullable: true
          description: P2 预留：密级（PUBLIC/INTERNAL/CONFIDENTIAL）；P0 恒 null
          x-reserved-for: P2
        domain:
          type: string
          nullable: true
          description: P2 预留：标准域；P0 恒 null
          x-reserved-for: P2
        effectiveAt:
          type: string
          format: date-time
          nullable: true
          description: P2 预留：条款生效时间；P0 恒 null
          x-reserved-for: P2
        indexVersion:
          type: string
          nullable: true
          description: P2 预留：索引版本；P0 恒 null
          x-reserved-for: P2
        env:
          type: string
          nullable: true
          description: P2 预留：环境；P0 恒 null
          x-reserved-for: P2
        metadata:
          type: object
          additionalProperties: {type: string}
          description: 透传标签，不参与 P0 检索逻辑
    ChunkPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Chunk'}
    ChunkPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ChunkPage'}
    ChunkPreviewRequest:
      type: object
      required: [chunkType]
      properties:
        chunkType: {$ref: '#/components/schemas/ChunkType'}
        chunkSize: {type: integer, minimum: 100, maximum: 4096, default: 512, description: 仅 FIXED 生效（字符数）}
        chunkOverlap: {type: integer, minimum: 0, maximum: 512, default: 64}
        respectSentenceBoundary: {type: boolean, default: true}
        maxPreview: {type: integer, minimum: 1, maximum: 200, default: 50}
    ChunkPreviewResult:
      type: object
      required: [documentId, chunkType, totalChunks, items]
      properties:
        documentId: {type: string}
        chunkType: {$ref: '#/components/schemas/ChunkType'}
        totalChunks: {type: integer, minimum: 0}
        clauseCount: {type: integer, minimum: 0, nullable: true, description: CLAUSE 模式下应等于文档条款数}
        items:
          type: array
          items: {$ref: '#/components/schemas/Chunk'}
    ChunkPreviewResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ChunkPreviewResult'}
    Clause:
      type: object
      required: [clauseNo, title, chapterPath, text, level, tenantId]
      properties:
        tenantId: {$ref: '#/components/schemas/TenantId'}
        clauseNo: {type: string, examples: ['4.1.1']}
        title: {type: string}
        chapterPath: {type: string}
        text: {type: string}
        pageNo: {type: integer, minimum: 1, nullable: true}
        level: {type: integer, minimum: 1}
        chunkId: {type: string, nullable: true}
    ClausePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Clause'}
    ClausePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ClausePage'}
    StandardMeta:
      type: object
      required: [documentId, tenantId, standardNo, standardName, issuer, clauseCount]
      properties:
        documentId: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        standardNo: {type: string, examples: ['JR/T 0088']}
        standardName: {type: string}
        issuer: {type: string, description: 发布机构}
        issuedAt: {type: string, format: date, nullable: true}
        effectiveAt:
          type: string
          format: date-time
          nullable: true
          description: P0 仅展示；P2 用于时效检索
          x-reserved-for: P2
        replacedBy: {type: string, nullable: true}
        domain:
          type: string
          nullable: true
          description: P2 预留：标准域；P0 可空
          x-reserved-for: P2
        securityLevel:
          type: string
          nullable: true
          description: P2 预留：密级；P0 可空
          x-reserved-for: P2
        clauseCount: {type: integer, minimum: 0}
        confidence: {type: number, minimum: 0, maximum: 1, description: 元数据抽取置信度}
        source: {type: string, enum: [AUTO_EXTRACTED, MANUAL_CORRECTED], default: AUTO_EXTRACTED}
        version:
          type: string
          nullable: true
          description: P2 预留：版本；P0 可空
          x-reserved-for: P2
        env:
          type: string
          nullable: true
          description: P2 预留：环境；P0 可空
          x-reserved-for: P2
        updatedAt: {type: string, format: date-time}
    StandardMetaUpdateRequest:
      type: object
      minProperties: 1
      properties:
        standardNo: {type: string}
        standardName: {type: string}
        issuer: {type: string}
        effectiveAt: {type: string, format: date-time, nullable: true, x-reserved-for: P2}
        domain: {type: string, nullable: true, x-reserved-for: P2}
        securityLevel: {type: string, nullable: true, x-reserved-for: P2}
        confidence: {type: number, minimum: 0, maximum: 1}
    StandardMetaResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/StandardMeta'}

    # ------------------------------------------------------------------
    # 向量化 / 索引
    # ------------------------------------------------------------------
    JobStatus:
      type: string
      enum: [QUEUED, RUNNING, PAUSED, SUCCEEDED, FAILED]
    EmbeddingFailure:
      type: object
      properties:
        chunkId: {type: string}
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
    EmbeddingJob:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [kbId, status, model, dimension, total, processed, failed]
          properties:
            kbId: {type: string}
            documentIds:
              type: array
              items: {type: string}
            status: {$ref: '#/components/schemas/JobStatus'}
            model: {type: string, examples: ['bge-m3']}
            dimension: {type: integer, minimum: 1}
            total: {type: integer, minimum: 0}
            processed: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            progress: {type: integer, minimum: 0, maximum: 100}
            failures:
              type: array
              items: {$ref: '#/components/schemas/EmbeddingFailure'}
            error: {type: string, nullable: true}
    EmbeddingJobCreateRequest:
      type: object
      required: [kbId]
      properties:
        kbId: {type: string}
        documentIds:
          type: array
          description: 为空表示知识库全量
          items: {type: string}
        model: {type: string, default: bge-m3}
    EmbeddingJobResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/EmbeddingJob'}
    IndexBuild:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [kbId, status, totalChunks, indexedChunks]
          properties:
            kbId: {type: string}
            status: {$ref: '#/components/schemas/JobStatus'}
            totalChunks: {type: integer, minimum: 0}
            indexedChunks: {type: integer, minimum: 0}
            progress: {type: integer, minimum: 0, maximum: 100}
            durationMs: {type: integer, minimum: 0, nullable: true}
            indexType:
              type: string
              nullable: true
              description: P2 预留（P0 固定 HNSW）；P0 可空且不参与逻辑
              x-reserved-for: P2
            metric:
              type: string
              nullable: true
              description: P2 预留；P0 可空
              x-reserved-for: P2
            params:
              type: object
              nullable: true
              additionalProperties: true
              description: P2 预留；P0 可空
              x-reserved-for: P2
            indexSlot:
              type: string
              nullable: true
              description: P2 预留；P0 可空
              x-reserved-for: P2
            alias:
              type: string
              nullable: true
              description: P2 预留；P0 可空
              x-reserved-for: P2
            version:
              type: string
              nullable: true
              description: P2 预留；P0 可空
              x-reserved-for: P2
            env:
              type: string
              nullable: true
              description: P2 预留；P0 可空
              x-reserved-for: P2
            error: {type: string, nullable: true}
            startedAt: {type: string, format: date-time, nullable: true}
            finishedAt: {type: string, format: date-time, nullable: true}
    IndexBuildRequest:
      type: object
      required: [kbId]
      properties:
        kbId: {type: string}
        documentIds:
          type: array
          items: {type: string}
        indexType: {type: string, nullable: true, x-reserved-for: P2, description: P2 预留，P0 忽略}
        metric: {type: string, nullable: true, x-reserved-for: P2, description: P2 预留，P0 忽略}
        params: {type: object, nullable: true, additionalProperties: true, x-reserved-for: P2}
        indexSlot: {type: string, nullable: true, x-reserved-for: P2}
        alias: {type: string, nullable: true, x-reserved-for: P2}
        version: {type: string, nullable: true, x-reserved-for: P2}
        env: {type: string, nullable: true, x-reserved-for: P2}
    IndexBuildResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/IndexBuild'}
    IndexStatus:
      type: object
      required: [kbId, indexStatus, collection, dimension, docCount, chunkCount]
      properties:
        kbId: {type: string}
        indexStatus: {$ref: '#/components/schemas/IndexState'}
        collection: {type: string, examples: ['kb_default_v1']}
        dimension: {type: integer, minimum: 1}
        docCount: {type: integer, minimum: 0}
        chunkCount: {type: integer, minimum: 0}
        lastBuildId: {type: string, nullable: true}
        lastBuiltAt: {type: string, format: date-time, nullable: true}
        version: {type: string, nullable: true, x-reserved-for: P2}
        env: {type: string, nullable: true, x-reserved-for: P2}
    IndexStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/IndexStatus'}

    # ------------------------------------------------------------------
    # 检索
    # ------------------------------------------------------------------
    RetrievalMode:
      type: string
      enum: [vector, bm25, hybrid]
      default: vector
      description: |
        P0 仅 vector 实际执行；bm25（P1 #71）与 hybrid（P1 #72）收到时返回
        `RETRIEVAL_MODE_NOT_ENABLED` 告警与空 hits，不报错。客户端必须容忍未知枚举值。
    RetrievalFilters:
      type: object
      properties:
        standardNo: {type: string, description: 标准编号精确/前缀匹配，如 JR/T 0088}
        issuer: {type: string, description: 发布机构，包含匹配}
        clauseNo: {type: string, description: 条款编号定位，如 4.1.1}
        domain:
          type: string
          nullable: true
          description: 标准域；P0 生效（chunk.meta.domain），为空不参与检索
        securityLevel:
          type: string
          nullable: true
          description: |
            密级上限（PUBLIC/INTERNAL/CONFIDENTIAL/SECRET）。
            行级密级校验在召回阶段始终生效（#88）；细粒度密级策略 P2 #89。
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
          description: 实施日期下界；P0 生效，缺失实施日期的条款不命中
        effectiveTo:
          type: string
          format: date-time
          nullable: true
          description: 实施日期上界；P0 生效
    RetrieveRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 0
          maxLength: 20000
          description: |
            建议 ≤2000 字符；超过 2000 将截断并返回 QUERY_TRUNCATED 告警，
            空查询返回 QUERY_EMPTY 告警与空 hits（不报错）。
        kbId:
          type: string
          nullable: true
          description: 单库检索；与 kbIds 互斥，同时传入返回 400
        kbIds:
          type: array
          default: []
          maxItems: 20
          description: 多库检索；与 kbId 互斥，为空时检索全部有权限的知识库（P2 #262 跨库编排预留）
          items: {type: string}
        topK: {type: integer, minimum: 1, maximum: 50, default: 5}
        retrievalMode: {$ref: '#/components/schemas/RetrievalMode'}
        rerank:
          type: boolean
          default: false
          description: |
            P1 Cross-Encoder 重排预留；P0 收到 true 时返回 RERANK_NOT_ENABLED 告警，
            并返回未重排的向量召回结果（不报错）
          x-reserved-for: P1
        sessionId:
          type: string
          nullable: true
          description: P1 多轮会话预留；P0 接收但不保持上下文
          x-reserved-for: P1
        filters: {$ref: '#/components/schemas/RetrievalFilters'}
    RetrieveHit:
      type: object
      required: [rank, score, chunkId, documentId, kbId, text]
      properties:
        rank: {type: integer, minimum: 1}
        score: {type: number, minimum: 0, maximum: 1}
        chunkId: {type: string}
        documentId: {type: string}
        kbId: {type: string}
        clauseNo: {type: string, nullable: true}
        chapterPath: {type: string, nullable: true}
        pageNo: {type: integer, minimum: 1, nullable: true}
        text: {type: string}
        standardNo: {type: string, nullable: true}
        standardName: {type: string, nullable: true}
        securityLevel: {type: string, nullable: true}
        citation: {$ref: '#/components/schemas/Citation'}
    RetrieveResult:
      type: object
      required: [query, normalizedQuery, retrievalMode, rerank, hits, latencyMs]
      properties:
        query: {type: string}
        normalizedQuery: {type: string}
        retrievalMode: {$ref: '#/components/schemas/RetrievalMode'}
        rerank: {type: boolean, default: false}
        hits:
          type: array
          items: {$ref: '#/components/schemas/RetrieveHit'}
        latencyMs: {type: integer, minimum: 0, description: 查询处理 + 召回 + 权限复核总耗时}
        degraded: {type: boolean, default: false}
        degradedReason: {type: string, nullable: true, description: 如 VECTOR_TIMEOUT}
        warnings:
          type: array
          description: "兜底/未启用告警，形如 `CODE: 说明`"
          items: {type: string}
        timings:
          type: object
          description: 分段耗时（毫秒）：queryUnderstandingMs/embeddingMs/searchMs/guardMs/totalMs
          additionalProperties: {type: number}
        traceId: {type: string}
    RetrieveResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/RetrieveResult'}
    QueryUnderstandingRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 0, maxLength: 20000}
        kbId: {type: string, nullable: true}
    QueryUnderstanding:
      type: object
      required: [originalQuery, normalizedQuery, warnings]
      properties:
        originalQuery: {type: string}
        normalizedQuery: {type: string}
        standardNo: {type: string, nullable: true, examples: ['JR/T 0088']}
        clauseNo: {type: string, nullable: true, examples: ['4.1.1']}
        tokens:
          type: array
          items: {type: string}
        warnings:
          type: array
          items: {type: string}
        latencyMs: {type: number, minimum: 0, description: 查询处理耗时，计入检索 P95}
        truncated: {type: boolean, default: false}
    QueryUnderstandingResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/QueryUnderstanding'}

    # ------------------------------------------------------------------
    # 问答 / 引用 / 标准简介
    # ------------------------------------------------------------------
    CapabilityType:
      type: string
      enum: [RAG, SKILL]
      description: P0 仅 RAG；SKILL 为 P3 预留，P0 恒 disabled
    ConversationMode:
      type: string
      enum: [SINGLE_TURN, stream, non-stream]
      default: SINGLE_TURN
      description: |
        P0 单轮问答。`stream` / `non-stream` 仅声明期望输出模式（实际以调用
        `/chat` 或 `/chat/stream` 为准），服务端不因此保持上下文；传入 sessionId
        也不做多轮记忆（P1 #115）。客户端必须容忍未知枚举值。
    AnswerFormat:
      type: string
      enum: [MARKDOWN]
      default: MARKDOWN
    FinishReason:
      type: string
      enum: [STOP, LENGTH, CONTENT_FILTER, REFUSED, ERROR]
    ChatRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 2000}
        kbId:
          type: string
          nullable: true
          description: 单库问答；与 kbIds 互斥
        kbIds:
          type: array
          default: []
          maxItems: 20
          description: P2 预留的多库问答；P0 默认空，非空时与 kbId 互斥
          x-reserved-for: P2
          items: {type: string}
        sessionId:
          type: string
          nullable: true
          description: P1 多轮会话预留；P0 不持久化上下文
          x-reserved-for: P1
        conversationMode:
          allOf:
            - $ref: '#/components/schemas/ConversationMode'
          description: P1 多轮预留；P0 固定 SINGLE_TURN
          x-reserved-for: P1
        retrievalMode: {$ref: '#/components/schemas/RetrievalMode'}
        rerank:
          type: boolean
          default: false
          description: P1 重排预留；P0 固定 false
          x-reserved-for: P1
        topK: {type: integer, minimum: 1, maximum: 20, default: 5}
        capability:
          allOf:
            - $ref: '#/components/schemas/CapabilityType'
          default: RAG
          description: P0 仅 RAG；Skill 传入会被拒绝
        filters: {$ref: '#/components/schemas/RetrievalFilters'}
    Citation:
      type: object
      required: [chunkId, documentId]
      properties:
        chunkId: {type: string}
        documentId: {type: string}
        docId: {type: string, description: '与 documentId 等价，兼容 #106 验收口径'}
        standardNo: {type: string, nullable: true}
        standardName: {type: string, nullable: true}
        clauseNo: {type: string, nullable: true, description: 回答必须可溯源到条款编号}
        pageNo:
          type: integer
          minimum: 1
          nullable: true
          description: 预留：条款页码（P0 可空，P1 起稳定返回）
          x-reserved-for: P1
        chapterPath:
          type: string
          nullable: true
          description: 预留：章节路径（P0 可空，P1 起稳定返回）
          x-reserved-for: P1
        quote:
          type: string
          nullable: true
          description: 预留：原文摘录；P0 可空
          x-reserved-for: P1
        score: {type: number, minimum: 0, maximum: 1}
    TokenUsage:
      type: object
      required: [promptTokens, completionTokens, totalTokens]
      properties:
        promptTokens: {type: integer, minimum: 0}
        completionTokens: {type: integer, minimum: 0}
        totalTokens: {type: integer, minimum: 0}
    Answer:
      type: object
      required: [answerId, content, format, citations, refused, confidence, finishReason, retrievalMode, rerank, createdAt, tenantId]
      properties:
        answerId: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        sessionId: {type: string, nullable: true, x-reserved-for: P1}
        content: {type: string, description: Markdown 正文；拒答时为空或引导语}
        format: {$ref: '#/components/schemas/AnswerFormat'}
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        refused: {type: boolean, description: 无依据时拒答，不得编造}
        refusalReason: {type: string, nullable: true}
        confidence: {type: number, minimum: 0, maximum: 1}
        usage: {$ref: '#/components/schemas/TokenUsage'}
        finishReason: {$ref: '#/components/schemas/FinishReason'}
        retrievalMode: {$ref: '#/components/schemas/RetrievalMode'}
        rerank: {type: boolean, default: false}
        promptTemplateVersion: {type: string, examples: ['rag-answer@3']}
        provider: {type: string, nullable: true, description: 实际使用的 LLM 供应商}
        degraded: {type: boolean, description: 是否发生检索/模型降级}
        warnings:
          type: array
          items: {type: string}
        timings:
          type: object
          additionalProperties: {type: number}
        traceId: {type: string}
        createdAt: {type: string, format: date-time}
    ChatResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Answer'}
    SseMeta:
      type: object
      required: [answerId, traceId, retrievalMode, startedAt]
      properties:
        answerId: {type: string}
        sessionId: {type: string, nullable: true}
        traceId: {type: string}
        retrievalMode: {$ref: '#/components/schemas/RetrievalMode'}
        startedAt: {type: string, format: date-time}
    SseDelta:
      type: object
      required: [answerId, seq, delta]
      properties:
        answerId: {type: string}
        seq:
          type: integer
          minimum: 1
          description: |
            流内单调递增序号。SSE 实际 `id` 为 `<streamKey>:<seq>`，客户端断线后
            原样回传 `Last-Event-ID`，服务端据此定位流并从该序号之后续传。
        delta: {type: string}
    SseCitation:
      type: object
      required: [answerId, citations]
      properties:
        answerId: {type: string}
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
    SseDone:
      type: object
      required: [answerId, finishReason, refused]
      properties:
        answerId: {type: string}
        finishReason: {$ref: '#/components/schemas/FinishReason'}
        refused: {type: boolean}
        refusalReason: {type: string, nullable: true}
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        usage: {$ref: '#/components/schemas/TokenUsage'}
        content:
          type: string
          description: |
            经引用校验、拒答判定与 Markdown 格式化后的最终正文。客户端应以其覆盖流式增量，
            保证“流式展示”与 `/chat` 非流式结果一致。
        confidence: {type: number, minimum: 0, maximum: 1}
        provider: {type: string, nullable: true}
        degraded: {type: boolean}
        warnings:
          type: array
          items: {type: string}
        timings:
          type: object
          additionalProperties: {type: number}
          description: firstTokenMs / retrievalMs / llmMs / postprocessMs 等阶段耗时（毫秒）
        promptTemplateVersion: {type: string, nullable: true}
        traceId: {type: string, nullable: true}
    SseError:
      type: object
      required: [code, message, retryable]
      properties:
        code: {type: string, pattern: '^(AUTH|PERM|PARAM|BIZ|SYS|RATE)\.[A-Z0-9_]+$'}
        message: {type: string}
        retryable: {type: boolean}
        answerId: {type: string, nullable: true}
    SummaryElement:
      type: object
      required: [key, label, value]
      properties:
        key: {type: string, examples: [scope, main_content, effective_date]}
        label: {type: string}
        value: {type: string}
        sourceClauseNo: {type: string, nullable: true}
        sourceQuote: {type: string, nullable: true}
    Summary:
      type: object
      required: [id, tenantId, documentId, standardNo, standardName, elements, generatedAt]
      properties:
        id: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        documentId: {type: string}
        standardNo: {type: string}
        standardName: {type: string}
        scope: {type: string, description: 适用范围}
        mainContent: {type: string, description: 主要技术内容概述}
        elements:
          type: array
          items: {$ref: '#/components/schemas/SummaryElement'}
        effectiveAt: {type: string, format: date, nullable: true}
        generatedAt: {type: string, format: date-time}
        model: {type: string}
        promptTemplateVersion: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        summaryVersion: {type: integer, minimum: 1}
        documentVersion: {type: integer, minimum: 1}
        clauseCount: {type: integer, minimum: 0}
        source: {type: string, enum: [EXTRACTIVE], description: 抽取式生成，不调用生成模型补全}
        trace:
          type: object
          properties:
            documentVersion: {type: integer}
            metadataSource: {type: string, nullable: true}
            metadataConfidence: {type: number, nullable: true}
            missingElements:
              type: array
              items: {type: string}
    SummaryResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Summary'}
    SummaryCreateRequest:
      type: object
      properties:
        regenerate: {type: boolean, default: false}
    PromptTemplate:
      type: object
      required: [name, version, purpose, active, updatedAt]
      properties:
        name: {type: string, examples: [rag-answer]}
        version: {type: string, examples: ['3']}
        purpose: {type: string, enum: [ANSWER, SUMMARY, QUERY_UNDERSTANDING]}
        variables:
          type: array
          items: {type: string}
        contentHash: {type: string, description: 模板内容哈希，便于审计复现}
        active: {type: boolean}
        updatedAt: {type: string, format: date-time}
    PromptTemplateListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: {$ref: '#/components/schemas/PromptTemplate'}

    # ------------------------------------------------------------------
    # 导出 / 审计
    # ------------------------------------------------------------------
    ExportType:
      type: string
      enum: [CLAUSES, STANDARD_SUMMARY]
    ExportFormat:
      type: string
      enum: [PDF, XLSX, DOCX]
    ExportStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, EXPIRED]
    ExportJob:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [kbId, documentId, type, format, status, progress, scope, clauseCount]
          properties:
            kbId: {type: string}
            documentId: {type: string}
            type: {$ref: '#/components/schemas/ExportType'}
            format: {$ref: '#/components/schemas/ExportFormat'}
            status: {$ref: '#/components/schemas/ExportStatus'}
            progress: {type: integer, minimum: 0, maximum: 100}
            scope: {type: string, description: '导出范围：KB/DOC/CLAUSES:ALL 或 SUMMARY:5'}
            clauseCount: {type: integer, minimum: 0, description: 条款清单为导出条目数；标准简介为要素数 5}
            retryCount: {type: integer, minimum: 0}
            maxRetries: {type: integer, minimum: 0}
            fileName: {type: string, nullable: true}
            sizeBytes: {type: integer, minimum: 0, nullable: true}
            fileHash: {type: string, nullable: true, description: SHA-256（明文文件）}
            downloadUrl: {type: string, nullable: true}
            errorCode: {type: string, nullable: true}
            errorMessage: {type: string, nullable: true}
            error: {type: string, nullable: true, deprecated: true}
            expiresAt: {type: string, format: date-time, nullable: true}
            finishedAt: {type: string, format: date-time, nullable: true}
    ExportCreateRequest:
      type: object
      required: [documentId, type, format]
      properties:
        kbId: {type: string, description: 仅兼容入口 /exports 需要；推荐使用路径参数}
        documentId: {type: string}
        type: {$ref: '#/components/schemas/ExportType'}
        format: {$ref: '#/components/schemas/ExportFormat'}
    ExportJobResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ExportJob'}
    ExportJobPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/ExportJob'}
    ExportJobPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ExportJobPage'}
    AuditResult:
      type: string
      enum: [SUCCESS, FAILURE, DENIED]
    AuditLog:
      type: object
      required: [id, tenantId, actorId, action, objectType, result, traceId, createdAt]
      properties:
        id: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        actorId: {type: string}
        actorName: {type: string}
        action: {type: string, examples: [doc.upload]}
        objectType: {type: string, examples: [document]}
        objectId: {type: string, nullable: true}
        result: {$ref: '#/components/schemas/AuditResult'}
        ip: {type: string, nullable: true}
        userAgent: {type: string, nullable: true}
        traceId: {type: string}
        detail:
          type: object
          additionalProperties: true
          description: 脱敏后的变更摘要，不含密码/密钥/原文全文
        createdAt: {type: string, format: date-time}
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/AuditLog'}
    AuditLogPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AuditLogPage'}

    # ------------------------------------------------------------------
    # 安全与合规
    # ------------------------------------------------------------------
    TlsPosture:
      type: object
      required: [enabled, minVersion]
      properties:
        enabled: {type: boolean}
        minVersion: {type: string, examples: ['TLSv1.2']}
        certificateExpiresAt: {type: string, format: date-time, nullable: true}
    StorageEncryptionPosture:
      type: object
      required: [encryption, algorithm, keyManagement, keyRotationEnabled]
      properties:
        encryption: {type: boolean}
        algorithm: {type: string, examples: [AES-256-GCM]}
        keyManagement: {type: string, examples: [KMS/Vault]}
        keyRotationEnabled: {type: boolean}
        lastRotatedAt: {type: string, format: date-time, nullable: true}
    SecurityPosture:
      type: object
      required: [tls, storage, checkedAt]
      properties:
        tls: {$ref: '#/components/schemas/TlsPosture'}
        storage: {$ref: '#/components/schemas/StorageEncryptionPosture'}
        checkedAt: {type: string, format: date-time}
    SecurityPostureResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SecurityPosture'}
    SecurityAction:
      type: string
      enum: [ALLOW, BLOCK, REPLACE, WARN]
    SecurityRuleDefinition:
      type: object
      required: [ruleId, ruleType, pattern, matchType, enabled, weight]
      properties:
        ruleId: {type: string, pattern: '^[A-Za-z0-9_.-]{2,64}$'}
        ruleType: {$ref: '#/components/schemas/SecurityCheckType'}
        pattern: {type: string, minLength: 1, maxLength: 512, description: CONTAINS 为字面量，REGEX 为正则表达式}
        matchType: {type: string, enum: [REGEX, CONTAINS]}
        description: {type: string, maxLength: 256, nullable: true}
        enabled: {type: boolean}
        weight: {type: number, minimum: 0, maximum: 1, description: Prompt 注入评分权重；内容规则命中即评分 1}
    SecurityPolicyRule:
      type: object
      required: [enabled, action, ruleVersion]
      properties:
        enabled: {type: boolean}
        action: {$ref: '#/components/schemas/SecurityAction'}
        ruleVersion: {type: string, minLength: 1, maxLength: 32}
        threshold: {type: number, minimum: 0, maximum: 1, nullable: true}
        rules:
          type: array
          items: {$ref: '#/components/schemas/SecurityRuleDefinition'}
          description: 查询返回完整规则；更新时省略 rules 表示只修改策略，传入数组表示整体替换该类规则
    SecurityPolicy:
      type: object
      required: [inputContent, outputContent, promptInjection, updatedAt]
      properties:
        inputContent: {$ref: '#/components/schemas/SecurityPolicyRule'}
        outputContent: {$ref: '#/components/schemas/SecurityPolicyRule'}
        promptInjection: {$ref: '#/components/schemas/SecurityPolicyRule'}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, nullable: true}
    SecurityPolicyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SecurityPolicy'}
    SecurityPolicyUpdateRequest:
      type: object
      minProperties: 1
      properties:
        inputContent: {$ref: '#/components/schemas/SecurityPolicyRule'}
        outputContent: {$ref: '#/components/schemas/SecurityPolicyRule'}
        promptInjection: {$ref: '#/components/schemas/SecurityPolicyRule'}
    SecurityCheckType:
      type: string
      enum: [INPUT_CONTENT, OUTPUT_CONTENT, PROMPT_INJECTION]
    SecurityCheckRequest:
      type: object
      required: [type, content]
      properties:
        type: {$ref: '#/components/schemas/SecurityCheckType'}
        content: {type: string, maxLength: 20000}
    SecurityCheckResult:
      type: object
      required: [type, passed, action, ruleVersion, traceId]
      properties:
        type: {$ref: '#/components/schemas/SecurityCheckType'}
        passed: {type: boolean}
        action: {$ref: '#/components/schemas/SecurityAction'}
        riskTypes:
          type: array
          items: {type: string, examples: [SENSITIVE_WORD, PROMPT_INJECTION, JAILBREAK, PII]}
        score: {type: number, minimum: 0, maximum: 1}
        sanitizedContent: {type: string, nullable: true, description: REPLACE 时的净化结果}
        ruleVersion: {type: string}
        traceId: {type: string}
    SecurityCheckResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SecurityCheckResult'}

    # ------------------------------------------------------------------
    # 可观测
    # ------------------------------------------------------------------
    RequestLogEntry:
      type: object
      required: [requestId, traceId, method, path, status, latencyMs, occurredAt]
      properties:
        requestId: {type: string}
        traceId: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        userId: {type: string, nullable: true}
        method: {type: string}
        path:
          type: string
          description: 接口路径（不含 query string）
        status: {type: integer}
        latencyMs: {type: integer, minimum: 0}
        outcome:
          type: string
          enum: [SUCCESS, DENIED, FAILURE]
          description: 成功 / 鉴权拒绝 / 其他失败
        service: {type: string}
        clientIpHash:
          type: string
          nullable: true
          description: 客户端 IP 的 SHA-256 摘要，不保存原始 IP
        occurredAt: {type: string, format: date-time}
    RequestLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/RequestLogEntry'}
    RequestLogPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/RequestLogPage'}
    TraceSpan:
      type: object
      required: [spanId, name, stage, startTime, durationMs, status]
      properties:
        traceId: {type: string}
        spanId: {type: string}
        parentSpanId: {type: string, nullable: true}
        name: {type: string, examples: [retrieve, generate]}
        stage: {type: string, enum: [AUTH, RETRIEVE, RERANK, PROMPT, LLM, SECURITY, INDEX, OTHER]}
        service: {type: string, examples: [platform-api, svc-query]}
        kind: {type: string, examples: [SERVER]}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        durationMs: {type: number, minimum: 0}
        status: {type: string, enum: [UNSET, OK, ERROR]}
        attributes:
          type: object
          additionalProperties: true
          description: 环节标签（kbId、chunkCount、hits 等），不含正文与密钥
        error: {type: string, nullable: true}
    TraceDetail:
      type: object
      required: [traceId, totalLatencyMs, spans, status]
      properties:
        traceId: {type: string}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        userId: {type: string, nullable: true}
        totalLatencyMs: {type: integer, minimum: 0}
        spanCount: {type: integer, minimum: 0}
        errorSpanCount: {type: integer, minimum: 0}
        services:
          type: array
          items: {type: string}
        spans:
          type: array
          items: {$ref: '#/components/schemas/TraceSpan'}
        unavailableSources:
          type: array
          description: 查询失败的下游服务；已采集部分仍返回
          items: {type: string}
        status: {type: string, enum: [OK, ERROR]}
        queriedAt: {type: string, format: date-time}
    TraceResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/TraceDetail'}
    MetricsSummary:
      type: object
      required: [window, qps, latencyP95Ms, errorRate, successRate, collectedAt]
      properties:
        window: {type: string, enum: ['5m', '15m', '1h', '24h']}
        qps: {type: number, minimum: 0}
        latencyP50Ms: {type: integer, minimum: 0}
        latencyP95Ms: {type: integer, minimum: 0}
        latencyP99Ms: {type: integer, minimum: 0}
        errorRate: {type: number, minimum: 0, maximum: 1}
        successRate: {type: number, minimum: 0, maximum: 1}
        cpuUsage: {type: number, minimum: 0, maximum: 1}
        memoryUsage: {type: number, minimum: 0, maximum: 1}
        collectedAt: {type: string, format: date-time}
    MetricsSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/MetricsSummary'}

    # ------------------------------------------------------------------
    # 平台配置 / UI
    # ------------------------------------------------------------------
    SystemConfig:
      type: object
      required: [defaultCapability, supportedFormats, maxUploadSizeBytes, maxQueryLength, streamingEnabled]
      properties:
        defaultCapability: {$ref: '#/components/schemas/CapabilityType'}
        supportedFormats:
          type: array
          items: {$ref: '#/components/schemas/DocumentFormat'}
        maxUploadSizeBytes: {type: integer, minimum: 1}
        maxQueryLength: {type: integer, minimum: 1}
        streamingEnabled: {type: boolean}
        retrievalTopK: {type: integer, minimum: 1, maximum: 50}
        updatedAt: {type: string, format: date-time}
    SystemConfigResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SystemConfig'}
    SystemConfigUpdateRequest:
      type: object
      minProperties: 1
      properties:
        defaultCapability: {$ref: '#/components/schemas/CapabilityType'}
        maxUploadSizeBytes: {type: integer, minimum: 1}
        maxQueryLength: {type: integer, minimum: 1}
        streamingEnabled: {type: boolean}
        retrievalTopK: {type: integer, minimum: 1, maximum: 50}
    AdminOverview:
      type: object
      required: [kbCount, documentCount, chunkCount, userCount, qps, latencyP95Ms, errorRate]
      properties:
        kbCount: {type: integer, minimum: 0}
        documentCount: {type: integer, minimum: 0}
        chunkCount: {type: integer, minimum: 0}
        userCount: {type: integer, minimum: 0}
        qps: {type: number, minimum: 0}
        latencyP95Ms: {type: integer, minimum: 0}
        errorRate: {type: number, minimum: 0, maximum: 1}
        updatedAt: {type: string, format: date-time}
    AdminOverviewResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AdminOverview'}
    Capability:
      type: object
      required: [code, name, enabled]
      properties:
        code: {$ref: '#/components/schemas/CapabilityType'}
        name: {type: string}
        enabled: {type: boolean}
        availableFrom: {type: string, examples: [P0, P3]}
        description: {type: string}
    CapabilityConfig:
      type: object
      required: [capabilities, defaultCapability, skillEnabled]
      properties:
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/Capability'}
        defaultCapability: {$ref: '#/components/schemas/CapabilityType'}
        skillEnabled: {type: boolean, const: false, description: P0 固定 false（P3 才启用）}
    CapabilityConfigResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/CapabilityConfig'}
    UIConfig:
      type: object
      required: [supportedFormats, maxUploadSizeBytes, streamingEnabled, defaultCapability, maxQueryLength]
      properties:
        supportedFormats:
          type: array
          items: {$ref: '#/components/schemas/DocumentFormat'}
        maxUploadSizeBytes: {type: integer}
        streamingEnabled: {type: boolean}
        defaultCapability: {$ref: '#/components/schemas/CapabilityType'}
        maxQueryLength: {type: integer}
        showCitationPageNo: {type: boolean, description: P0 false；P1 页码稳定后开启}
    UIConfigResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/UIConfig'}

    # ------------------------------------------------------------------
    # 模型服务
    # ------------------------------------------------------------------
    ModelStatus:
      type: string
      enum: [UP, DEGRADED, DOWN]
    ModelProvider:
      type: object
      required: [code, name, models, status]
      properties:
        code: {type: string, examples: [openai-compatible]}
        name: {type: string}
        models:
          type: array
          items: {type: string}
        status: {$ref: '#/components/schemas/ModelStatus'}
        latencyP95Ms: {type: integer, minimum: 0, nullable: true}
        active: {type: boolean, default: false, description: 是否为当前激活供应商}
    ModelProviderListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: {$ref: '#/components/schemas/ModelProvider'}
    ModelMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [system, user, assistant]}
        content: {type: string}
    ModelChatRequest:
      type: object
      required: [messages]
      properties:
        provider:
          type: string
          nullable: true
          description: 手动切换供应商 code；缺省使用当前激活供应商
        model: {type: string, nullable: true}
        messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ModelMessage'}
        temperature: {type: number, minimum: 0, maximum: 2, default: 0.1}
        maxTokens: {type: integer, minimum: 1, maximum: 8192, default: 1024}
    ModelChatResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [provider, model, content, usage, latencyMs]
              properties:
                provider: {type: string}
                model: {type: string}
                content: {type: string}
                usage: {$ref: '#/components/schemas/TokenUsage'}
                latencyMs: {type: integer, minimum: 0}
                degraded: {type: boolean, description: 是否发生供应商故障切换}
                warnings:
                  type: array
                  items: {type: string}
                attempts:
                  type: array
                  description: 脱敏后的调用尝试链
                  items:
                    type: object
                    properties:
                      provider: {type: string}
                      model: {type: string, nullable: true}
                      ok: {type: boolean}
                      errorCode: {type: string, nullable: true}
                      error: {type: string, nullable: true}
                      latencyMs: {type: integer, minimum: 0}
    RefusalStats:
      type: object
      required: [answered, refused, total, refusalRate]
      properties:
        answered: {type: integer, minimum: 0}
        refused: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        refusalRate: {type: number, minimum: 0, maximum: 1}
        byReason:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        byTenant:
          type: object
          additionalProperties: {type: integer, minimum: 0}
    RefusalStatsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/RefusalStats'}
    EmbeddingRequest:
      type: object
      required: [texts]
      properties:
        model: {type: string, default: bge-m3}
        texts:
          type: array
          minItems: 1
          maxItems: 256
          items: {type: string}
    EmbeddingResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [model, dimension, vectors, usage]
              properties:
                model: {type: string}
                dimension: {type: integer}
                vectors:
                  type: array
                  items:
                    type: array
                    items: {type: number}
                usage: {$ref: '#/components/schemas/TokenUsage'}
    ModelHealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: {$ref: '#/components/schemas/ModelProvider'}

