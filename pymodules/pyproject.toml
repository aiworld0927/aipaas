[project]
name = "pymodules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.7",
    "fastapi>=0.142.2",
    "flagembedding>=1.4.2",
    "grandalf>=0.8",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "mcp<2",
    "minio>=7.2.20",
    "modelscope>=1.40.1",
    "numpy>=2.5.3",
    "openai-agents==0.23.1",
    "pymilvus[model]>=3.0.2",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.18.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"

# 项目下配置环境变量(更推荐)
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.optional-dependencies]
gpu124 = []
gpu128 = []
cpu = []

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu124" },
        { extra = "gpu128" },
    ],
]

[tool.uv.sources]
# uv sync --extra gpu128 强制从指定的源安装,不传参数，回退到 PyPI默认源。
torch = [
    { index = "pytorch-cuda128", marker = "extra == 'gpu128'" },
    { index = "pytorch-cuda124", marker = "extra != 'gpu128' and extra == 'gpu124'" },
    { index = "cpu", marker = "extra != 'gpu128' and extra != 'gpu124' and extra == 'cpu'" },
]
torchvision = [
    { index = "pytorch-cuda128", marker = "extra == 'gpu128'" },
    { index = "pytorch-cuda124", marker = "extra != 'gpu128' and extra == 'gpu124'" },
    { index = "cpu", marker = "extra != 'gpu128' and extra != 'gpu124' and extra == 'cpu'" },
]
torchaudio = [
    { index = "pytorch-cuda128", marker = "extra == 'gpu128'" },
    { index = "pytorch-cuda124", marker = "extra != 'gpu128' and extra == 'gpu124'" },
    { index = "cpu", marker = "extra != 'gpu128' and extra != 'gpu124' and extra == 'cpu'" },
]

[[tool.uv.index]]
name = "cpu"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true