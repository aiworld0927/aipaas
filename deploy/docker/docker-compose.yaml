# =============================================================================
# AIPaaS 五级编排 · 第 5 级：Web 前端（默认全量入口）
# -----------------------------------------------------------------------------
# 层级与文件：
#   1. docker-compose-base.yaml    技术组件
#   2. docker-compose-models.yaml  模型接入服务（include 第 1 级）
#   3. docker-compose-python.yaml  Python 业务编排（include 第 2 级）
#   4. docker-compose-java.yaml    Java 网关与管理平台（include 第 3 级）
#   5. docker-compose.yaml         Web 前端（include 第 4 级，本文件）
#
# 每一级都可独立作为启动入口，并自动拉起其下所有层级。例如：
#   docker compose -f docker-compose-base.yaml up -d
#   docker compose -f docker-compose-models.yaml up -d --build
#   docker compose -f docker-compose-python.yaml up -d --build
#   docker compose -f docker-compose-java.yaml up -d --build
#   docker compose up -d --build                     # 全量启动
#
# 首次使用：cp .env.example .env，并至少配置密钥及
# PLATFORM_BOOTSTRAP_ADMIN_PASSWORD（第 4 级及以上需要）。
# 可选技术组件仍由 COMPOSE_PROFILES=attu,nacos,rocketmq,vllm 控制。
# =============================================================================

include:
  - docker-compose-java.yaml

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
      tag: "{{.Name}}/{{.ID}}"

x-restart: &default-restart
  restart: unless-stopped

services:
  frontend:
    build:
      context: ../../web
      dockerfile: Dockerfile
    image: aipaas/frontend:${IMAGE_TAG:-latest}
    container_name: aipaas-frontend
    environment:
      # /api/v1/** 走 Java 统一网关；旧链路保留 Python 服务直连。
      PLATFORM_API_UPSTREAM: http://platform-api:8080
      QUERY_API_UPSTREAM: http://svc-query:${QUERY_WORKER_PORT:-8002}
      IMPORT_API_UPSTREAM: http://svc-ingest:${INGEST_WORKER_PORT:-8001}
      TLS_GENERATE_SELF_SIGNED: ${TLS_GENERATE_SELF_SIGNED:-true}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-localhost}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - platform-tls:/etc/nginx/tls
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    <<: [*default-restart, *default-logging]

networks:
  default:
    name: aipaas-network
