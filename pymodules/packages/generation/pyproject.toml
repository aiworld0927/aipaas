[project]
name = "aipaas-generation"
version = "0.1.0"
description = "AIPaaS 生成链路（LLM 调用、Prompt 组装、幻觉抑制、拒答、格式化、输入校验）"
requires-python = ">=3.12"
dependencies = [
    "aipaas-common",
    "httpx>=0.27.0",
]

[tool.uv.sources]
aipaas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_generation"]
