[project]
name = "svc-ingest"
version = "0.1.0"
description = "AIPaaS 文档导入服务（LangGraph + Milvus + MinIO）"
requires-python = ">=3.12"
dependencies = [
    # 共享库（workspace 引用）
    "aipaas-common",
    "aipaas-model-clients",
    "aipaas-nacos",
    "aipaas-retrieval",
    "aipaas-storage",
    # Web 框架
    "fastapi>=0.142.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    # LangGraph 编排核心
    "langgraph>=1.2.12",
    "langchain>=1.4.3",
    "langchain-text-splitters>=1.1.3",
    # 模型相关
    # 注意：torch / flagembedding 强依赖 torch，必须放在 workspace 根的
    # cpu/gpu 分组里随分组安装（见根 pyproject.toml），写在这里会与分组索引冲突。
    "modelscope>=1.40.1",
    "transformers>=5.18.0",
    "numpy>=2.5.3",
]

[tool.uv.sources]
aipaas-common = { workspace = true }
aipaas-model-clients = { workspace = true }
aipaas-nacos = { workspace = true }
aipaas-retrieval = { workspace = true }
aipaas-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest_worker"]


