[project]
name = "pymodules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.7",
    "fastapi>=0.142.2",
    "flagembedding>=1.4.2",
    "grandalf>=0.8",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "mcp<2",
    "minio>=7.2.20",
    "modelscope>=1.40.1",
    "numpy>=2.5.3",
    "openai-agents==0.23.1",
    "pymilvus[model]>=3.0.2",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "transformers>=5.18.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"

# 项目下配置环境变量(更推荐)
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.optional-dependencies]
# extras 作为 torch 构建变体的切换器,版本与基础依赖统一锚定 2.11.0
# 执行一次 uv sync --extra <变体> 后,裸 uv run/uv sync 会保留已安装的构建
gpu124 = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
]
gpu128 = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
]
cpu = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu124" },
        { extra = "gpu128" },
    ],
]

[tool.uv.sources]
# 默认(无 extra、Windows/Linux)从 cu128 源安装 GPU 版;macOS 回退 PyPI
# --extra cpu / gpu124 显式切换到对应构建;--extra gpu128 与默认行为一致
torch = [
    { index = "cpu", extra = "cpu" },
    { index = "pytorch-cuda126", extra = "gpu124" },
    { index = "pytorch-cuda128", extra = "gpu128" },
    { index = "pytorch-cuda128", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'cpu' and extra != 'gpu124' and extra != 'gpu128'" },
]
torchvision = [
    { index = "cpu", extra = "cpu" },
    { index = "pytorch-cuda126", extra = "gpu124" },
    { index = "pytorch-cuda128", extra = "gpu128" },
    { index = "pytorch-cuda128", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'cpu' and extra != 'gpu124' and extra != 'gpu128'" },
]
torchaudio = [
    { index = "cpu", extra = "cpu" },
    { index = "pytorch-cuda126", extra = "gpu124" },
    { index = "pytorch-cuda128", extra = "gpu128" },
    { index = "pytorch-cuda128", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'cpu' and extra != 'gpu124' and extra != 'gpu128'" },
]

[[tool.uv.index]]
name = "cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
# PyTorch 已不再发布 cu124 构建(torch>=2.11 无 cu124),此处实际指向 cu126
name = "pytorch-cuda126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true