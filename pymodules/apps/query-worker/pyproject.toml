[project]
name = "svc-query"
version = "0.1.0"
description = "AIPaaS 用户查询服务（LangGraph + DashScope + MCP + SSE）"
requires-python = ">=3.12"
dependencies = [
    # 共享库（workspace 引用）
    "aipaas-common",
    "aipaas-generation",
    "aipaas-model-clients",
    "aipaas-nacos",
    "aipaas-retrieval",
    "aipaas-storage",
    "aipaas-mcp-agent1==0.1.0",  # MCP 客户端（v1: mcp<2, openai-agents<0.20.0）
    # Web 框架
    "fastapi>=0.142.2",
    "uvicorn>=0.30.0",
    # LangGraph 编排核心
    "langgraph>=1.2.12",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    # LLM 接入
    "dashscope>=1.27.7",
    "ragas>=0.4.3",
    # 模型相关
    # 注意：torch / flagembedding 强依赖 torch，必须放在 workspace 根的
    # cpu/gpu 分组里随分组安装（见根 pyproject.toml），写在这里会与分组索引冲突。
    "modelscope>=1.40.1",
    "transformers>=5.18.0",
    "numpy>=2.5.3",
]

[tool.uv.sources]
aipaas-common = { workspace = true }
aipaas-generation = { workspace = true }
aipaas-model-clients = { workspace = true }
aipaas-nacos = { workspace = true }
aipaas-retrieval = { workspace = true }
aipaas-storage = { workspace = true }
aipaas-mcp-agent1 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["query_worker"]


