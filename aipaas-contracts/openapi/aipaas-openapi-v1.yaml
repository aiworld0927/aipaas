        生成链路固定使用的内部路径，与对外 OpenAI 兼容 `/v1/chat/completions`（P1 #411）不共用路径。
        至少两家 OpenAI 兼容供应商直连；`provider` 可手动切换，未指定时使用当前激活供应商；
        主供应商失败时按优先级做简单故障切换，通过 `data.degraded` 与 `data.warnings` 给出降级提示。
        全部供应商失败返回 503 `MODEL_UNAVAILABLE` 与脱敏的 `attempts`；密钥不落日志。
