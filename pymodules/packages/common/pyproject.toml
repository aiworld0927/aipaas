[project]
name = "aipaas-common"
version = "0.1.0"
description = "AIPaaS 共享库（clients/core/utils/config），被 svc-import 和 svc-query 通过 workspace 引用"
requires-python = ">=3.12"
dependencies = [
    # Web 框架（sse_utils / task_utils 依赖）
    "fastapi>=0.142.2",
    "starlette>=0.45.0",
    # 基础工具
    "loguru>=0.7.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.0",
    "numpy>=2.5.3",
    "psutil>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipaas_common"]
