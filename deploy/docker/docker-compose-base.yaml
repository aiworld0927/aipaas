# =============================================================================
# AIPaaS 五级编排 · 第 1 级：平台技术组件
# -----------------------------------------------------------------------------
# 本层可独立启动，并被 docker-compose-models.yaml 通过 include 引用。
#   核心组件（默认启动）      ：etcd / minio / milvus / mongodb / postgres / redis
#                               prometheus / grafana（可观测）
#   可选组件（按 profile 启动，默认不启动）：
#     attu      —— Milvus 可视化管理 UI
#     nacos     —— Nacos 配置中心（复用核心 postgres）
#     rocketmq  —— namesrv + broker 消息队列
#     vllm      —— vLLM 推理引擎（Qwen3-0.6B，OpenAI 兼容接口，需 NVIDIA GPU）
#
# 通过 .env 中的 COMPOSE_PROFILES 控制加载哪些可选组件，例如：
#   COMPOSE_PROFILES=                  # 只起核心组件（默认）
#   COMPOSE_PROFILES=nacos             # 追加 Nacos
#   COMPOSE_PROFILES=vllm              # 只追加 vLLM
#   COMPOSE_PROFILES=nacos,rocketmq,vllm
# 也可命令行临时指定：docker compose --profile nacos up -d
#
# 数据目录: ${DOCKER_VOLUME_DIRECTORY}/volumes/xxx 本地目录挂载
# 依赖关系: milvus -> etcd + minio, nacos -> postgres, rocketmq-broker -> rocketmq-namesrv
# etcd 由 Milvus 与 APISIX（第 4 级）共用：APISIX 使用 /apisix 前缀独立存放路由配置。
# =============================================================================

# ---------- 共享配置锚点 ----------
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
      tag: "{{.Name}}/{{.ID}}"

x-restart: &default-restart
  restart: unless-stopped

# ---------- 资源限制说明（各服务 deploy.resources）----------
# limits        硬上限，docker compose 单机模式下直接落为 cgroup 限制（cpus 单位：核心数，可为小数）
# reservations  尽力保证：memory 落为 memory-reservation（内存紧张时才回收），cpus 仅 swarm 调度使用、单机不生效
# 取值依据：8 核 / 8G 宿主机，按实测常驻占用留 2~4 倍余量；可选组件按各自 JVM/服务特征设定


services:
  # =========================================================================
  # 层 0：一次性初始化 —— 预创建中间件数据卷目录（跑完即退出）
  # 避免 docker daemon 以 root 自动创建目录导致容器内非 root 进程无写权限
  # =========================================================================
  init-volumes:
    container_name: aipaas-init-volumes
    image: alpine
    user: root
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes:/volumes
    command: sh -c "mkdir -p /volumes/etcd /volumes/minio /volumes/milvus-data /volumes/attu-data /volumes/mongo/data /volumes/mongo/config && chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /volumes"
    restart: "no"

  # =========================================================================
  # 层 1：核心组件（默认启动）
  # =========================================================================

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    # etcd：只存 Milvus 元数据，实测常驻约 43MB
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    <<: [*default-restart, *default-logging]

  minio:
    container_name: milvus-minio
    #image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    # MinIO：对象存储，实测常驻约 112MB
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    <<: [*default-restart, *default-logging]

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.1
    # uid 跟随执行用户（数据属主与宿主机用户一致）；
    # gid 必须保留 999(milvus)，镜像内二进制和库仅对 milvus 组开放 r-x 权限
    user: "${HOST_UID:-1000}:999"
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started
    # Milvus：向量检索主力，实测常驻约 206MB，检索/构建索引时内存抬升明显
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.2'
          memory: 512M
    <<: [*default-restart, *default-logging]

  mongodb:
    image: amd64/mongo:8.0
    container_name: mongodb
    # 以执行用户身份运行，保证数据目录属主与宿主机用户一致
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # 管理员用户名（自行修改）
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      # 管理员密码（务必修改为强密码）
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-123456}
      # 初始化数据库名称
      MONGO_INITDB_DATABASE: admin
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongo/data:/data/db
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongo/config:/data/configdb
    # 关键配置：允许所有IP访问
    command: mongod --bind_ip 0.0.0.0
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    # MongoDB：任务/历史记录，实测常驻约 100MB
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    <<: [*default-restart, *default-logging]

  # =========================================================================
  # 层 2：可选组件 —— Milvus 管理 UI（profile: attu）
  # =========================================================================
  attu:
    container_name: attu
    image: zilliz/attu:v3.0.0
    profiles: ["attu"]
    ports:
      - "3000:3000"
    environment:
      - MILVUS_ADDRESS=milvus:19530
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/attu-data:/data
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      milvus:
        condition: service_started
    # Attu：Milvus 管理 UI，实测常驻约 56MB
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    <<: [*default-restart, *default-logging]

  # =========================================================================
  # 层 1：核心组件 —— PostgreSQL（Nacos 与 Java 平台共用实例、独立数据库）
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aipaas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nacos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nacos}
      POSTGRES_DB: ${POSTGRES_DB:-nacos}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./nacos/sql/01_create_nacos_user.sql:/docker-entrypoint-initdb.d/01_create_nacos_user.sql
      - ./nacos/sql/02_pg_schema.sql:/docker-entrypoint-initdb.d/02_pg_schema.sql
      - ./nacos/sql/03_pg_grant.sql:/docker-entrypoint-initdb.d/03_pg_grant.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nacos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # PostgreSQL：Nacos / Java 平台共用实例，实测常驻约 28MB
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    <<: [*default-restart, *default-logging]
  
  # =========================================================================
  # 层 2：可选组件 —— 配置中心（profile: nacos，复用核心 postgres）
  # =========================================================================
  nacos:
    image: nacos/nacos-server:v3.3.0
    container_name: aipaas-nacos
    profiles: ["nacos"]
    environment:
      # 核心模式：单机
      MODE: standalone
      # 控制台端口 (3.x 默认 8080)
      # NACOS_APPLICATION_PORT: 8080
      SPRING_DATASOURCE_PLATFORM: postgresql
      # nacos 镜像约定：数据源参数复用 MYSQL_SERVICE_* 前缀
      MYSQL_SERVICE_HOST: postgres
      MYSQL_SERVICE_PORT: "5432"
      MYSQL_SERVICE_DB_NAME: ${POSTGRES_DB:-nacos}
      MYSQL_SERVICE_USER: ${POSTGRES_USER:-nacos}
      MYSQL_SERVICE_PASSWORD: ${POSTGRES_PASSWORD:-nacos}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpc0lzTXlTZWNyZXRLZXlXaGljaFNob3VsZEJlMzJDaGFyYWN0ZXJzTGFyZ2U=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-mySecureValue123}
      # (可选) 启用 DNS 时必须设置，使其绑定到 0.0.0.0 而非回环地址
      # NACOS_NAMING_DNS_BIND_ADDRESS: 0.0.0.0
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "${NACOS_HTTP_PORT:-8848}:8848"    # HTTP API
      - "${NACOS_GRPC_PORT:-9848}:9848"    # gRPC API (客户端核心通信)
      - "${NACOS_CONSOLE_PORT:-8080}:8080" # 控制台 Web UI
      # (可选) DNS 服务，如果启用则取消注释，TCP/UDP 都需要
      # - "5353:5353/tcp"
      # - "5353:5353/udp"
    volumes:
      - nacos-data:/home/nacos/data
      - ${DOCKER_LOG_DIRECTORY:-.}/logs:/home/nacos/logs
      # ★★★ 挂载自定义配置文件（覆盖默认 application.properties）★★★
      - ./nacos/config/application.properties:/home/nacos/conf/application.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NACOS_PORT:-8848}/nacos/v3/admin/core/state/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Nacos：注册/配置中心，JVM_XMX=512m → 实测常驻约 750MB（堆外+元空间），故限额 768M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 256M
    <<: [*default-restart, *default-logging]

  # =========================================================================
  # 层 1：核心组件 —— Redis 缓存
  # =========================================================================
  redis:
    image: redis:7-alpine                   # 追求极致轻量、启动快速和可控的安全基线
    #image: redis/redis-stack-server:latest # 支持RedisJSON、RedisSearch等模块
    container_name: aipaas-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Redis：缓存，轻量组件
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    <<: [*default-restart, *default-logging]

  # =========================================================================
  # 层 1：核心组件 —— 可观测（Prometheus + Grafana）
  # -------------------------------------------------------------------------
  # 采集目标见 prometheus/prometheus-base.yml（含 APISIX / Java 平台 / Python 服务）；
  # Grafana 复用 grafana/provisioning 预置数据源与 grafana/dashboards 看板目录。
  # =========================================================================
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: aipaas-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus-base.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Prometheus：指标采集与短期存储，7 天保留
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    <<: [*default-restart, *default-logging]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: aipaas-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      TZ: Asia/Shanghai
    ports:
      # 默认 3001，避开 attu 占用的 3000
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Grafana：可视化看板，预置数据源指向 prometheus:9090
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
    <<: [*default-restart, *default-logging]

  # =========================================================================
  # 层 2：可选组件 —— 消息队列（profile: rocketmq）
  # =========================================================================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: aipaas-rocketmq-namesrv
    profiles: ["rocketmq"]
    command: sh mqnamesrv
    environment:
      JAVA_OPT: ${ROCKETMQ_NAMESRV_JAVA_OPT:--Xms128m -Xmx256m -Xmn64m}
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'exec 3<>/dev/tcp/localhost/9876' && echo ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # RocketMQ NameServer：JVM_XMX=256m，限额留出堆外开销
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    <<: [*default-restart, *default-logging]

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: aipaas-rocketmq-broker
    profiles: ["rocketmq"]
    command: sh mqbroker -n rocketmq-namesrv:9876
    environment:
      JAVA_OPT: ${ROCKETMQ_BROKER_JAVA_OPT:--Xms256m -Xmx512m -Xmn128m}
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_PORT2:-10909}:10909"
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    # RocketMQ Broker：JVM_XMX=512m，限额 1G 覆盖堆外与页缓存
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    <<: [*default-restart, *default-logging]

  # =========================================================================
  # 层 2：可选组件 —— vLLM 推理引擎（profile: vllm，需 NVIDIA GPU）
  # -------------------------------------------------------------------------
  # 以 OpenAI 兼容接口（/v1/chat/completions、/v1/models）对外提供 Qwen3-0.6B。
  # 业务侧接入方式：LLM_BASE_URL=http://vllm:8000/v1  LLM_API_KEY=EMPTY  LLM_MODEL_NAME=qwen3-0.6b
  # 前置条件：宿主机装好 NVIDIA 驱动 + nvidia-container-toolkit；
  #           模型文件已下载到 ${VLLM_MODEL_DIR}（ModelScope: Qwen/Qwen3-0.6B）。
  # =========================================================================
  vllm:
    image: vllm/vllm-openai:v0.11.0
    container_name: aipaas-vllm
    profiles: ["vllm"]
    # vLLM 多进程共享内存通信需要
    ipc: host
    command: >
      --model /models/Qwen3-0.6B
      --served-model-name ${VLLM_SERVED_MODEL_NAME:-qwen3-0.6b}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      --port 8000
    environment:
      # 模型全部走本地挂载目录，禁止运行时访问外网下载
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TZ: Asia/Shanghai
    volumes:
      - ${VLLM_MODEL_DIR:-../../models/Qwen3-0.6B}:/models/Qwen3-0.6B:ro
    ports:
      - "${VLLM_PORT:-8008}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 首次加载模型较慢，给足启动窗口
      start_period: 300s
    deploy:
      resources:
        # vLLM 只限 CPU：内存占用与模型/并发强相关，硬限会直接 OOM；
        # 显存侧由 --gpu-memory-utilization 控制，不做 memory 上限
        limits:
          cpus: '4.0'
        reservations:
          cpus: '1.0'
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    <<: [*default-restart, *default-logging]

# =============================================================================
# 命名卷（postgres / redis / nacos / rocketmq / prometheus / grafana 数据）
# =============================================================================
volumes:
  pg-data:
  redis-data:
  nacos-data:
  rocketmq-namesrv-data:
  rocketmq-broker-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: aipaas-network
