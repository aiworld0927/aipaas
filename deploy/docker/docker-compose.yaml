# =============================================================================
# AIPaaS 应用层编排（引用基础中间件编排 docker-compose-base.yaml）
# -----------------------------------------------------------------------------
# 结构：
#   docker-compose-base.yaml   —— 全部技术组件：核心（etcd / minio / milvus / mongodb）
#                                  可选 profile（attu / nacos+postgres / redis / rocketmq / vllm）
#   docker-compose.yaml（本文件）—— 应用服务：svc-model-embedding / svc-model-reranker
#                                            svc-ingest / svc-query / frontend
#
# 用法（在本文件所在目录执行）：
#   cp .env.example .env                    # 生成环境变量配置
#   docker compose up -d                    # 一键启动应用 + 核心中间件
#   docker compose up -d svc-query          # 只启动指定服务
#   docker compose ps                       # 查看状态
#   docker compose logs -f svc-query        # 查看服务日志
#   docker compose down                     # 停止全部
#
# 可选技术组件通过 .env 的 COMPOSE_PROFILES 控制（默认全部不启动）：
#   COMPOSE_PROFILES=nacos,rocketmq     # 追加 nacos(+postgres) 与 rocketmq
#   COMPOSE_PROFILES=vllm               # 追加 vLLM 本地推理（需 GPU）
#   可选值：attu / nacos / redis / rocketmq / vllm（逗号分隔，可组合）
#
# 环境变量优先级：shell 已导出变量（如 source ../scripts/setup-env.sh）> .env 文件 > 本文件内默认值
# =============================================================================

include:
  - docker-compose-base.yaml

# ---------- 共享配置锚点 ----------
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
      tag: "{{.Name}}/{{.ID}}"

x-restart: &default-restart
  restart: unless-stopped

services:

  # =========================================================================
  # 层 0：一次性初始化 —— 预创建应用日志目录
  # （base 中的 init-volumes 负责中间件数据目录，本服务负责应用日志目录）
  # =========================================================================
  init-app-dirs:
    container_name: aipaas-init-app-dirs
    image: alpine
    user: root
    volumes:
      - ${DOCKER_LOG_DIRECTORY:-.}/logs:/logs
    command: >
      sh -c "mkdir -p /logs/svc-ingest /logs/svc-query /logs/svc-model-embedding /logs/svc-model-reranker
        && chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /logs"
    restart: "no"

  # =========================================================================
  # 层 1：模型推理服务（嵌入 / 重排序，独立部署单元）
  # -------------------------------------------------------------------------
  # 后端开关：
  #   EMBEDDING_BACKEND=offline|online（online 走 DashScope 兼容接口）
  #   RERANKER_BACKEND=offline|online（online 走 DashScope TextReRank）
  # 离线后端需要把宿主机模型目录挂载到容器内：
  #   MODEL_BASE_DIR/bge-m3              -> /app/models/bge-m3
  #   MODEL_BASE_DIR/bge-reranker-large  -> /app/models/bge-reranker-large
  # =========================================================================

  svc-model-embedding:
    build:
      context: ../../pymodules
      dockerfile: apps/model-embedding-worker/Dockerfile
    image: aipaas/svc-model-embedding:latest
    container_name: aipaas-svc-model-embedding
    env_file: .env
    environment:
      # 服务端口
      MODEL_EMBEDDING_HOST: 0.0.0.0
      MODEL_EMBEDDING_PORT: "8101"
      # 后端：offline（本地 BGE-M3）/ online（远端接口）
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-offline}
      # 离线模型
      BGE_M3_PATH: /app/models/bge-m3
      BGE_DEVICE: ${BGE_DEVICE:-cpu}
      BGE_FP16: ${BGE_FP16:-False}
      # 在线模型（EMBEDDING_BACKEND=online 时生效）
      EMBEDDING_ONLINE_API_KEY: ${EMBEDDING_ONLINE_API_KEY:-}
      EMBEDDING_ONLINE_BASE_URL: ${EMBEDDING_ONLINE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_ONLINE_MODEL: ${EMBEDDING_ONLINE_MODEL:-text-embedding-v4}
      EMBEDDING_ONLINE_DIM: ${EMBEDDING_ONLINE_DIM:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 并发与批次
      MODEL_EMBEDDING_MAX_BATCH: ${MODEL_EMBEDDING_MAX_BATCH:-64}
      MODEL_EMBEDDING_MAX_CONCURRENCY: ${MODEL_EMBEDDING_MAX_CONCURRENCY:-1}
      # 日志（文件名：model-embedding-worker_YYYYMMDD.log）
      LOG_FILE_PREFIX: model-embedding-worker
      LOG_FILE_ENABLE: "True"
      LOG_FILE_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_CONSOLE_ENABLE: "True"
      LOG_CONSOLE_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    ports:
      - "${EMBEDDING_PORT:-8101}:8101"
    volumes:
      - ${DOCKER_LOG_DIRECTORY:-.}/logs/svc-model-embedding:/app/logs
      - ${MODEL_BASE_DIR:-../../models}/bge-m3:/app/models/bge-m3:ro
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      init-app-dirs:
        condition: service_completed_successfully
    # GPU 部署时按需放开（需已安装 nvidia-container-toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    <<: [*default-restart, *default-logging]

  svc-model-reranker:
    build:
      context: ../../pymodules
      dockerfile: apps/model-reranker-worker/Dockerfile
    image: aipaas/svc-model-reranker:latest
    container_name: aipaas-svc-model-reranker
    env_file: .env
    environment:
      MODEL_RERANKER_HOST: 0.0.0.0
      MODEL_RERANKER_PORT: "8102"
      # 后端：offline（本地 bge-reranker-large）/ online（DashScope TextReRank）
      RERANKER_BACKEND: ${RERANKER_BACKEND:-offline}
      # 离线模型
      BGE_RERANKER_LARGE: /app/models/bge-reranker-large
      BGE_RERANKER_DEVICE: ${BGE_RERANKER_DEVICE:-cpu}
      BGE_RERANKER_FP16: ${BGE_RERANKER_FP16:-0}
      # 在线模型（RERANKER_BACKEND=online 时生效）
      TEXT_RERANK_MODEL: ${TEXT_RERANK_MODEL:-qwen3-rerank}
      TEXT_RERANK_INSTRUCT: ${TEXT_RERANK_INSTRUCT:-针对给定的查询，检索能够解答该查询的相关段落}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_RERANKER_MAX_DOCS: ${MODEL_RERANKER_MAX_DOCS:-128}
      MODEL_RERANKER_MAX_CONCURRENCY: ${MODEL_RERANKER_MAX_CONCURRENCY:-1}
      LOG_FILE_PREFIX: model-reranker-worker
      LOG_FILE_ENABLE: "True"
      LOG_FILE_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_CONSOLE_ENABLE: "True"
      LOG_CONSOLE_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    ports:
      - "${RERANKER_PORT:-8102}:8102"
    volumes:
      - ${DOCKER_LOG_DIRECTORY:-.}/logs/svc-model-reranker:/app/logs
      - ${MODEL_BASE_DIR:-../../models}/bge-reranker-large:/app/models/bge-reranker-large:ro
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      init-app-dirs:
        condition: service_completed_successfully
    # GPU 部署时按需放开（需已安装 nvidia-container-toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    <<: [*default-restart, *default-logging]

  # =========================================================================
  # 层 2：Python 业务服务（依赖 base 中的 milvus / minio / mongodb 与模型服务）
  # =========================================================================

  svc-ingest:
    build:
      context: ../../pymodules
      dockerfile: apps/ingest-worker/Dockerfile
    image: aipaas/svc-ingest:latest
    container_name: aipaas-svc-ingest
    env_file: .env
    environment:
      # Milvus（容器内用服务名；远程中间件时在 .env 中改为 IP 地址）
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
      CHUNKS_COLLECTION: ${CHUNKS_COLLECTION:-chunks}
      # MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-aipaas}
      # MongoDB（对应 base 中 mongodb 服务，账密与其 MONGO_INITDB_ROOT_* 一致）
      MONGO_URL: ${MONGO_URL:-mongodb://admin:123456@mongodb:27017/?authSource=admin}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-aipaas}
      # LLM（对应 setup-env.sh 中的 LLM_BASE_URL/LLM_API_KEY/LLM_MODEL_NAME）
      OPENAI_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${LLM_API_KEY:-ollama}
      MODEL: ${LLM_MODEL_NAME:-qwen2.5}
      # 模型推理服务（容器内用服务名）
      EMBEDDING_SERVICE_URL: http://svc-model-embedding:8101
      RERANKER_SERVICE_URL: http://svc-model-reranker:8102
      # 日志（文件名：ingest-worker_YYYYMMDD.log）
      LOG_FILE_PREFIX: ingest-worker
      LOG_FILE_ENABLE: "True"
      LOG_FILE_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_CONSOLE_ENABLE: "True"
      LOG_CONSOLE_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    ports:
      - "${INGEST_PORT:-8000}:8000"
    volumes:
      - ${DOCKER_LOG_DIRECTORY:-.}/logs/svc-ingest:/app/logs
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      init-app-dirs:
        condition: service_completed_successfully
      svc-model-embedding:
        condition: service_healthy
      svc-model-reranker:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongodb:
        condition: service_started
    <<: [*default-restart, *default-logging]

  svc-query:
    build:
      context: ../../pymodules
      dockerfile: apps/query-worker/Dockerfile
    image: aipaas/svc-query:latest
    container_name: aipaas-svc-query
    env_file: .env
    environment:
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MONGO_URL: ${MONGO_URL:-mongodb://admin:123456@mongodb:27017/?authSource=admin}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-aipaas}
      OPENAI_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${LLM_API_KEY:-ollama}
      MODEL: ${LLM_MODEL_NAME:-qwen2.5}
      # 模型推理服务（容器内用服务名）
      EMBEDDING_SERVICE_URL: http://svc-model-embedding:8101
      RERANKER_SERVICE_URL: http://svc-model-reranker:8102
      LOG_FILE_PREFIX: query-worker
      LOG_FILE_ENABLE: "True"
      LOG_FILE_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_CONSOLE_ENABLE: "True"
      LOG_CONSOLE_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    ports:
      - "${QUERY_PORT:-8001}:8001"
    volumes:
      - ${DOCKER_LOG_DIRECTORY:-.}/logs/svc-query:/app/logs
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      init-app-dirs:
        condition: service_completed_successfully
      svc-model-embedding:
        condition: service_healthy
      svc-model-reranker:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    <<: [*default-restart, *default-logging]

  # =========================================================================
  # 层 3：前端（Nginx，反代 svc-query / svc-ingest）
  # =========================================================================

  frontend:
    build:
      context: ../../web
      dockerfile: Dockerfile
    image: aipaas/frontend:latest
    container_name: aipaas-frontend
    environment:
      QUERY_API_UPSTREAM: http://svc-query:8001
      IMPORT_API_UPSTREAM: http://svc-ingest:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      svc-ingest:
        condition: service_healthy
      svc-query:
        condition: service_healthy
    <<: [*default-restart, *default-logging]

# =============================================================================
# 网络：与 base 共用同一默认网络（本文件优先级高于 include 的文件）
# 服务间通过服务名互相访问（如 http://milvus:19530、http://minio:9000）
# =============================================================================
networks:
  default:
    name: aipaas-network
