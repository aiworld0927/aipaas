<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>文件导入服务</title>
    <style>
        :root{
            --bg:#f4f6fb;
            --panel:#ffffff;
            --text:#1a2233;
            --muted:#8a94a8;
            --brand:#3d7bff;
            --brand2:#7a5cff;
            --border:#e7eaf2;
            --radius:18px;
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,Arial,sans-serif;
            background:
                radial-gradient(1100px 520px at 10% -10%, rgba(61,123,255,.10), transparent 60%),
                radial-gradient(900px 480px at 95% -6%, rgba(122,92,255,.10), transparent 55%),
                var(--bg);
            color:var(--text);
            min-height:100vh;
            min-height:100dvh;
            display:flex;
            justify-content:center;
            padding:clamp(20px,4vh,48px) clamp(14px,4vw,32px);
        }
        .page{
            width:100%;
            max-width:820px;
            display:flex;
            flex-direction:column;
        }

        /* ===== 页头 ===== */
        .page-header{
            text-align:center;
            margin-bottom:28px;
        }
        .page-header .head-icon{
            width:58px;height:58px;
            margin:0 auto 14px;
            border-radius:18px;
            background:linear-gradient(135deg,var(--brand),var(--brand2));
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 14px 30px rgba(61,123,255,.32);
        }
        .page-header .head-icon svg{width:30px;height:30px}
        .page-header h1{
            font-size:clamp(20px,3vw,26px);
            font-weight:700;
            margin:0 0 8px;
            letter-spacing:.5px;
        }
        .page-header p{
            margin:0;
            color:var(--muted);
            font-size:14px;
            line-height:1.6;
        }

        /* ===== 拖拽上传区 ===== */
        .upload-area{
            position:relative;
            border:2px dashed rgba(61,123,255,.45);
            border-radius:22px;
            padding:clamp(36px,6vh,56px) 24px;
            text-align:center;
            cursor:pointer;
            background:#f8faff;
            transition:border-color .25s ease, background-color .25s ease, transform .25s ease, box-shadow .25s ease;
            margin-bottom:28px;
            overflow:hidden;
        }
        .upload-area::before{
            content:'';
            position:absolute;
            inset:0;
            background:radial-gradient(420px 180px at 50% 0%, rgba(61,123,255,.07), transparent 70%);
            pointer-events:none;
        }
        .upload-area:hover{
            border-color:rgba(61,123,255,.85);
            background:#f2f7ff;
            transform:translateY(-2px);
            box-shadow:0 18px 40px rgba(61,123,255,.12);
        }
        .upload-area:active{transform:translateY(0) scale(.995)}
        .upload-icon{
            width:76px;height:76px;
            margin:0 auto 16px;
            border-radius:50%;
            background:linear-gradient(135deg,rgba(61,123,255,.12),rgba(122,92,255,.12));
            display:flex;align-items:center;justify-content:center;
            animation:float 3s ease-in-out infinite;
            transition:transform .25s ease;
        }
        .upload-area:hover .upload-icon{transform:scale(1.08)}
        .upload-icon svg{width:36px;height:36px}
        @keyframes float{
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(-7px)}
        }
        .upload-title{
            margin:0 0 6px;
            font-size:17px;
            font-weight:600;
            color:var(--text);
        }
        .upload-sub{
            margin:0 0 16px;
            font-size:13px;
            color:var(--muted);
        }
        .upload-chips{
            display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
        }
        .upload-chips span{
            font-size:12px;
            font-weight:600;
            letter-spacing:.5px;
            color:var(--brand);
            background:rgba(61,123,255,.10);
            border:1px solid rgba(61,123,255,.22);
            padding:4px 14px;
            border-radius:999px;
        }
        .file-input{display:none}

        /* ===== 文件列表 ===== */
        .file-list{
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        .file-item{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:16px 18px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            box-shadow:0 6px 18px rgba(26,34,51,.06);
            animation:cardIn .3s ease both;
        }
        @keyframes cardIn{
            from{opacity:0;transform:translateY(-8px)}
            to{opacity:1;transform:translateY(0)}
        }
        .file-item:hover{box-shadow:0 10px 26px rgba(26,34,51,.10)}

        .file-info{
            display:flex;
            flex-direction:column;
            flex:1;
            min-width:0;
        }
        .file-name{
            font-weight:600;
            color:var(--text);
            font-size:14px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .file-size{
            font-size:12px;
            color:var(--muted);
            margin-top:4px;
        }

        /* ===== 状态徽标 ===== */
        .status-badge{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            padding:5px 12px;
            border-radius:999px;
            font-size:12px;
            font-weight:600;
            min-width:82px;
            text-align:center;
            flex:0 0 auto;
            white-space:nowrap;
        }
        .status-uploading{
            background:#fff4e2;
            color:#d97706;
        }
        .status-uploading::before{
            content:'';
            width:7px;height:7px;border-radius:50%;
            background:#f39c12;
            animation:blink 1s ease-in-out infinite;
        }
        @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
        .status-processing{
            background:#e9f0ff;
            color:#2563eb;
        }
        .status-processing::before{
            content:'';
            width:11px;height:11px;
            border-radius:50%;
            border:2px solid rgba(37,99,235,.25);
            border-top-color:#2563eb;
            animation:spin .8s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        .status-completed{
            background:#e5f8ee;
            color:#16a34a;
        }
        .status-completed::before{
            content:'✓';
            font-size:11px;
            font-weight:700;
        }
        .status-error{
            background:#fdecec;
            color:#dc2626;
        }
        .status-error::before{
            content:'✕';
            font-size:11px;
            font-weight:700;
        }

        /* ===== 进度条 ===== */
        .progress-bar-container{
            width:100%;
            height:6px;
            background:#edf0f7;
            margin-top:10px;
            border-radius:999px;
            overflow:hidden;
            display:none;
        }
        .progress-bar{
            height:100%;
            background:var(--brand);
            width:0%;
            border-radius:999px;
            position:relative;
            overflow:hidden;
            transition:width .4s ease, background-color .3s;
        }
        .progress-bar::after{
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
            animation:shimmer 1.6s infinite;
        }
        @keyframes shimmer{
            from{transform:translateX(-100%)}
            to{transform:translateX(100%)}
        }

        /* ===== 任务日志（可展开/收起） ===== */
        .log-details{
            margin-top:10px;
            font-size:12px;
            color:var(--muted);
        }
        .log-details summary{
            cursor:pointer;
            user-select:none;
            color:#6c7a89;
            font-weight:600;
            list-style:none;
            display:inline-flex;
            align-items:center;
            gap:6px;
        }
        .log-details summary::-webkit-details-marker{display:none}
        .log-details summary::before{
            content:'▸';
            font-size:10px;
            color:var(--brand);
            transition:transform .2s;
        }
        .log-details[open] summary::before{transform:rotate(90deg)}
        .log-list{
            margin:8px 0 0 4px;
            padding:8px 12px;
            list-style:none;
            background:#f7f9fd;
            border:1px solid var(--border);
            border-radius:10px;
        }
        .log-list li{
            margin:4px 0;
            line-height:1.5;
            color:#5c6880;
        }

        /* ===== 响应式 ===== */
        @media (max-width:600px){
            .file-item{
                flex-direction:column;
                align-items:stretch;
            }
            .status-badge{
                align-self:flex-end;
            }
            .upload-area{padding:32px 16px}
        }
    </style>
</head>
<body>

<div class="page">
    <header class="page-header">
        <div class="head-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3Z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 8V16M12 8L9.5 10.5M12 8L14.5 10.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>知识库文件导入</h1>
        <p>将文档导入金融标准化知识库，系统将自动解析、切分并建立检索索引</p>
    </header>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.5 19C4.01472 19 2 16.9853 2 14.5C2 12.1569 3.69897 10.1989 5.94868 9.84519C6.32828 6.70055 9.03032 4.26172 12.2857 4.26172C15.4572 4.26172 18.1041 6.58233 18.5907 9.61412C20.5869 9.99892 22 11.7409 22 13.8462C22 16.2359 20.0966 18.1731 17.75 18.1731H15" stroke="#3d7bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 20.7383V11.5M12 11.5L8.8 14.7M12 11.5L15.2 14.7" stroke="#7a5cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <p class="upload-title">点击或拖拽文件到此处</p>
        <p class="upload-sub">支持多文件批量上传，文件将自动上传并解析入库</p>
        <div class="upload-chips">
            <span>PDF</span>
            <span>Markdown</span>
        </div>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md">
    </div>

    <div id="fileList" class="file-list">
        <!-- 文件列表将在这里生成 -->
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    
    // 模拟后端API地址
    // const API_BASE = 'http://127.0.0.1:8000';
    const API_BASE = '/';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#ecf6fd';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.backgroundColor = '#3498db'; // 蓝色
        } else {
            bar.style.backgroundColor = '#f39c12'; // 橘红色
        }
    }

    async function uploadFile(file) {
        // 创建文件项UI
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <details class="log-details">
                        <summary>日志（点击展开）</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');
        const logDetails = itemEl.querySelector('.log-details');
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        // 构建FormData
        const formData = new FormData();
        formData.append('files', file);

        try {
            // 1. 上传文件
            progressContainer.style.display = 'block';
            // 模拟上传进度
            updateProgressBar(progressBar, 50);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');
            
            const result = await response.json();
            const taskId = result.task_ids[0]; // 假设一次传一个或取第一个

            // 上传完成，进入处理中，进度固定为30%
            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '处理中...';
            statusBadge.className = 'status-badge status-processing';

            // 2. 轮询状态
            pollStatus(taskId, itemEl);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
        }
    }

    function normalizeDoneLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“已完成”
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“正在进行.../处理中...”
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        // 更新 summary（即使收起也能看到进度）
        logSummary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;

        // 清空并重建列表
        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        // 如果没有任何日志，默认收起；否则保持用户选择
        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        
        const interval = setInterval(async () =>{
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await res.json();

                // 渲染日志（done/running）
                renderLogs(itemEl, data.done_list, data.running_list);
                
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    // 保持处理中状态
                    statusBadge.textContent = '处理中...';
                    // 确保进度为30%
                     updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 2000); // 每2秒轮询一次
    }
</script>

</body>
</html>
