    post:
      tags: [检索引擎]
      operationId: retrieve
      summary: 向量语义召回（P0 #70，含权限过滤 #88）
      description: |
        P0 仅向量召回（`retrievalMode=vector`），`rerank=false`。
        召回结果必须已按角色与知识库权限过滤，越权/密级不符条款 0 泄露；
        单路召回超时自动降级并返回 `degraded=true`。
        `latencyMs` 覆盖查询处理 + 向量召回 + 权限复核，检索 P95 ≤ 500ms。
      x-owner: python
      x-p0-feature: ['#63', '#70', '#88']
      x-permission: retrieval:query
      x-audit: {required: true, actions: [retrieval.query, permission.denied]}
      x-p95-ms: 500
      requestBody:
        required: true
        content:
