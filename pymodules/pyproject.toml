[project]
name = "pymodules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.7",
    "fastapi>=0.142.2",
    "flagembedding>=1.4.2",
    "grandalf>=0.8",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "mcp<2",
    "minio>=7.2.20",
    "modelscope>=1.40.1",
    "numpy>=2.5.3",
    "openai-agents==0.23.1",
    "pymilvus[model]>=3.0.2",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "transformers>=5.18.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"

# 项目下配置环境变量(更推荐)
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
# 锁死 PyTorch 构建为 cu128: 裸 uv sync / uv run / PyCharm 自动同步都只会装这一版,
# 不会再退回 PyPI 的 CPU 构建(防止 GPU 主机被意外降级)。
# 单位 CPU 机器需在首次初始化后手动覆盖为 CPU 构建(在 pymodules 目录下执行,单行):
#   uv pip install --no-config --python .venv\Scripts\python.exe torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --reinstall --index-url https://mirrors.aliyun.com/pypi/simple
# (--no-config 绕过本 override 的 cu128 锁定; --reinstall 必须,
#  否则 ==2.11.0 会被已装的 2.11.0+cu128 满足而跳过安装)
override-dependencies = [
    "torch==2.11.0+cu128",
    "torchaudio==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda128" }]
torchvision = [{ index = "pytorch-cuda128" }]
torchaudio = [{ index = "pytorch-cuda128" }]

[[tool.uv.index]]
name = "pytorch-cuda128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true